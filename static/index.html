<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>picoIDE</title>
    <link rel="icon" type="image/svg+xml" href="icone.svg">
    
    <!-- Tudo em /vendor vem embutido no executável, não de CDN: o servidor pode
         estar sem internet, e aí não haveria editor nem terminal. -->
    <link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/dracula.css">
    <script src="vendor/codemirror/lib/codemirror.js"></script>
    <!-- O modo rust usa defineSimpleMode, que vem neste addon: sem ele o
         realce de .rs quebra silenciosamente. -->
    <script src="vendor/codemirror/addon/mode/simple.js"></script>
    <script src="vendor/codemirror/mode/javascript/javascript.js"></script>
    <script src="vendor/codemirror/mode/rust/rust.js"></script>
    <!-- htmlmixed depende de xml + css + javascript -->
    <script src="vendor/codemirror/mode/xml/xml.js"></script>
    <script src="vendor/codemirror/mode/css/css.js"></script>
    <script src="vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="vendor/codemirror/mode/toml/toml.js"></script>
    <!-- meta.js mapeia extensão -> modo; os modos abaixo são os que
         cobrem os formatos mais comuns. Sem o modo carregado, o
         arquivo abre como texto puro em vez de quebrar. -->
    <script src="vendor/codemirror/mode/meta.js"></script>
    <script src="vendor/codemirror/mode/clike/clike.js"></script>
    <script src="vendor/codemirror/mode/python/python.js"></script>
    <script src="vendor/codemirror/mode/shell/shell.js"></script>
    <script src="vendor/codemirror/mode/yaml/yaml.js"></script>
    <script src="vendor/codemirror/mode/markdown/markdown.js"></script>
    <script src="vendor/codemirror/mode/dockerfile/dockerfile.js"></script>
    <script src="vendor/codemirror/mode/go/go.js"></script>
    <script src="vendor/codemirror/mode/lua/lua.js"></script>
    <script src="vendor/codemirror/mode/ruby/ruby.js"></script>
    <script src="vendor/codemirror/mode/sql/sql.js"></script>
    <script src="vendor/codemirror/mode/cmake/cmake.js"></script>
    <script src="vendor/codemirror/mode/nginx/nginx.js"></script>
    <script src="vendor/codemirror/mode/properties/properties.js"></script>
    <script src="vendor/codemirror/mode/diff/diff.js"></script>

    <link rel="stylesheet" href="vendor/xterm/css/xterm.css" />
    <script src="vendor/xterm/lib/xterm.js"></script>
    <script src="vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

    <style>
        /* As duas medidas ajustáveis moram aqui: arrastar as divisórias só
           troca estas variáveis, e o resto do layout se acomoda sozinho. */
        body { --larg-lateral: 280px; --alt-terminal: 300px;
               margin: 0; padding: 0; background-color: #1e1e1e; color: #ccc; font-family: sans-serif;
               display: grid;
               grid-template-columns: var(--larg-lateral) 5px 1fr;
               grid-template-rows: 1fr 5px var(--alt-terminal);
               height: 100vh; overflow: hidden; }
        .divisoria { background: #333; }
        .divisoria:hover, body.arrastando .divisoria { background: #0e639c; }
        #divisoria-lateral { grid-column: 2; grid-row: 1 / -1; cursor: col-resize; }
        #divisoria-terminal { grid-column: 3; grid-row: 2; cursor: row-resize; }
        /* Durante o arrasto, uma camada por cima de tudo: sem ela o ponteiro
           entra no xterm ou no editor e o movimento vira seleção de texto. */
        #capa-arrasto { position: fixed; inset: 0; z-index: 9999; display: none; }
        body.arrastando #capa-arrasto { display: block; }
        body.arrastando { user-select: none; }
        #sidebar { grid-column: 1; grid-row: 1 / -1; background-color: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        #sidebar-header { padding: 10px; background-color: #333; display: flex; justify-content: space-between; align-items: center; }
        #root-path-input { background: #1e1e1e; color: #ccc; border: 1px solid #555; padding: 5px; width: 100%; border-radius: 3px; margin-right: 5px; outline: none; font-family: monospace;}
        #root-path-input:focus { border-color: #0e639c; }
        #sidebar-header button { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 5px; }
        #file-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .file-item { cursor: pointer; padding: 4px; border-radius: 3px; user-select: none; white-space: nowrap; }
        .file-item:hover { background-color: #37373d; }
        .is-dir { font-weight: bold; color: #d7ba7d; }
        .folder-children { border-left: 1px solid #444; margin-left: 10px; padding-left: 5px; }
        #sidebar.soltando { outline: 2px dashed #0e639c; outline-offset: -2px; }
        #status-upload:empty { display: none; }
        #status-upload { padding: 6px 10px; font-size: 12px; color: #d7ba7d; background: #2d2d30; }
        #editor-container { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; overflow: hidden; }
        #top-bar { background-color: #333; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; }
        #btn-baixar-atual { background: #3a3d41; color: #ccc; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; margin-right: 4px; }
        #btn-salvar { background: #0e639c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; transition: background 0.3s ease; }
        .CodeMirror { flex-grow: 1; height: 100%; font-size: 16px; }
        #terminal-container { grid-column: 3; grid-row: 3; background-color: #000; border-top: 1px solid #333; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; }
        /* A área do terminal é uma ÁRVORE de painéis: cada folha é um grupo com
           a sua barra de abas, e cada divisão arruma os filhos em linha ou
           coluna. O min-width/min-height zerado é obrigatório: sem ele o
           conteúdo do xterm vira piso de tamanho e o flex não encolhe mais. */
        #painel-terminais { flex-grow: 1; display: flex; min-width: 0; min-height: 0; }
        #painel-terminais > * { flex: 1 1 0; }
        .divisao { display: flex; min-width: 0; min-height: 0; }
        .divisao.linha { flex-direction: row; }
        .divisao.coluna { flex-direction: column; }
        .divisao > * { flex-basis: 0; min-width: 0; min-height: 0; }
        .divisao > .divisoria { flex: 0 0 5px; }
        .divisao.linha > .divisoria { cursor: col-resize; }
        .divisao.coluna > .divisoria { cursor: row-resize; }
        .grupo-terminal { display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; }
        /* Com dois painéis à vista, é preciso saber qual deles recebe o teclado. */
        .grupo-terminal.foco > .barra-abas { box-shadow: inset 0 -2px 0 #0e639c; }
        /* Os terminais de um mesmo grupo ficam empilhados no mesmo lugar; só o
           ativo aparece. Manter os inativos montados (em vez de recriar)
           preserva a tela e o scrollback de cada um ao trocar de aba. */
        .telas-terminais { flex-grow: 1; position: relative; overflow: hidden; }
        .terminal-tela { position: absolute; inset: 0; display: none; }
        .terminal-tela.ativa { display: block; }
        /* Casa das telas enquanto a árvore é remontada: elas são MOVIDAS de um
           painel para o outro, nunca recriadas, senão cada rearranjo perderia a
           tela, o scrollback e a conexão do terminal. */
        #deposito-telas { display: none; }
        /* Arrastar aba: o rótulo segue o ponteiro e o retângulo azul mostra
           onde o painel vai nascer. */
        body.arrastando-aba { user-select: none; cursor: grabbing; }
        body.arrastando-aba #capa-arrasto { display: block; }
        #fantasma-aba, #indicador-solta { position: fixed; display: none; pointer-events: none; }
        #fantasma-aba { z-index: 10001; background: #0e639c; color: #fff; padding: 3px 8px; font-size: 12px; border-radius: 3px; }
        #indicador-solta { z-index: 10000; background: rgba(14, 99, 156, 0.35); border: 1px solid #0e639c; box-sizing: border-box; }
        /* O padding fica AQUI, no próprio .xterm, e não no pai: o FitAddon
           calcula as linhas a partir da altura do pai menos o padding deste
           elemento. Com o padding no pai ele contava uma linha a mais do que
           cabe, e a última saía cortada para fora da página. */
        .terminal { height: 100%; padding: 10px; box-sizing: border-box; }
        .barra-abas { display: flex; align-items: stretch; background: #252526; border-bottom: 1px solid #333; overflow-x: auto; flex-shrink: 0; }
        .aba { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #2d2d30; color: #ccc; border-right: 1px solid #1e1e1e; cursor: pointer; white-space: nowrap; font-size: 13px; user-select: none; }
        .aba.ativa { background: #1e1e1e; color: #fff; }
        .aba .fechar { opacity: 0.5; padding: 0 2px; }
        .aba .fechar:hover { opacity: 1; }
        .aba .sujo { color: #d7ba7d; }
        .nova-aba, .dividir-aba { background: none; border: none; color: #ccc; cursor: pointer; padding: 4px 10px; font-size: 14px; }
        .nova-aba:hover, .dividir-aba:hover { color: #fff; }

        /* No telefone o picoIDE não tenta encolher a mesa inteira. Cada área
           vira uma tela: o terminal fica no centro, com arquivos à esquerda e
           editor à direita. O desktop continua exatamente com a grade acima. */
        #mobile-pager, #mobile-keybar { display: none; }
        @media (max-width: 700px) {
            body { display: block; height: 100dvh; min-height: 100dvh; overflow: hidden;
                   --teclado-virtual: 0px; }
            #sidebar, #editor-container, #terminal-container {
                position: absolute; inset: 0; z-index: 1; border: 0;
                transition: transform 190ms ease, opacity 190ms ease;
                will-change: transform;
            }
            #sidebar { transform: translateX(-100%); }
            #terminal-container { transform: translateX(0); padding-bottom: calc(44px + env(safe-area-inset-bottom)); }
            #editor-container { transform: translateX(100%); }
            body.mobile-files #sidebar, body.mobile-editor #editor-container { transform: translateX(0); z-index: 3; }
            body.mobile-files #terminal-container { transform: translateX(100%); }
            body.mobile-editor #terminal-container { transform: translateX(-100%); }
            body.mobile-files #editor-container { transform: translateX(100%); }
            body.mobile-editor #sidebar { transform: translateX(-100%); }
            #divisoria-lateral, #divisoria-terminal { display: none; }
            #sidebar-header { padding: 8px; }
            #file-list { padding: 8px; }
            .file-item { padding: 8px 6px; }
            .aba { min-height: 34px; padding: 5px 11px; font-size: 14px; }
            #top-bar { padding: 7px 8px; gap: 6px; }
            #current-file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #btn-baixar-atual, #btn-salvar { min-height: 34px; padding: 5px 8px; }
            .CodeMirror { font-size: 16px; }
            .terminal { padding: 6px; }
            .barra-abas { min-height: 36px; }
            #mobile-pager { display: flex; position: fixed; z-index: 20; left: 50%;
                bottom: calc(48px + var(--teclado-virtual) + env(safe-area-inset-bottom)); transform: translateX(-50%);
                border: 1px solid #555; border-radius: 16px; overflow: hidden; background: #252526;
                box-shadow: 0 2px 10px #0008; }
            #mobile-pager button { min-width: 38px; min-height: 30px; padding: 0 8px;
                color: #ccc; background: transparent; border: 0; font-size: 15px; }
            #mobile-pager button.ativo { color: #fff; background: #0e639c; }
            #mobile-keybar { display: flex; position: fixed; z-index: 21; left: 0; right: 0;
                bottom: calc(var(--teclado-virtual) + env(safe-area-inset-bottom)); height: 42px;
                align-items: center; gap: 4px; padding: 3px 5px; overflow-x: auto;
                background: #252526; border-top: 1px solid #444; box-sizing: border-box;
                -webkit-overflow-scrolling: touch; }
            #mobile-keybar button { flex: 0 0 auto; min-width: 34px; height: 32px; padding: 0 8px;
                color: #eee; background: #3a3d41; border: 1px solid #555; border-radius: 4px;
                font: 14px monospace; }
            #mobile-keybar button.modificador { background: #0e639c; }
        }
        @media (prefers-reduced-motion: reduce) {
            #sidebar, #editor-container, #terminal-container { transition: none; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <input type="text" id="root-path-input" value="/" title="Digite a pasta e aperte Enter">
            <button onclick="document.getElementById('input-arquivos').click()" title="Enviar arquivos para esta pasta">📤</button>
            <button onclick="mudarRaiz()" title="Atualizar">🔄</button>
            <input type="file" id="input-arquivos" multiple hidden>
        </div>
        <div id="status-upload"></div>
        <div id="file-list">Carregando...</div>
    </div>

    <div id="editor-container">
        <div id="abas-arquivos" class="barra-abas"></div>
        <div id="top-bar">
            <span id="current-file">Nenhum arquivo aberto</span>
            <span>
                <button id="btn-baixar-atual" onclick="baixarAtual()" title="Baixar o arquivo aberto">⬇ Baixar</button>
                <button id="btn-salvar" onclick="salvarArquivo()">Salvar (Ctrl+S)</button>
            </span>
        </div>
        <textarea id="editor"></textarea>
    </div>

    <div class="divisoria" id="divisoria-lateral" title="Arraste para redimensionar"></div>
    <div class="divisoria" id="divisoria-terminal" title="Arraste para redimensionar"></div>
    <div id="capa-arrasto"></div>

    <div id="terminal-container">
        <div id="painel-terminais"></div>
    </div>
    <div id="deposito-telas"></div>
    <div id="fantasma-aba"></div>
    <div id="indicador-solta"></div>
    <div id="mobile-pager" aria-label="Trocar de tela">
        <button data-tela="files" title="Arquivos">☰</button>
        <button data-tela="terminal" title="Terminal">›_</button>
        <button data-tela="editor" title="Editor">✎</button>
    </div>
    <div id="mobile-keybar" aria-label="Teclas extras para programação"></div>

    <script>
        // --- ENDEREÇOS ---
        // Tudo é montado a partir da pasta em que a página foi servida, e não
        // da raiz do site. É isso que permite rodar atrás de um proxy em
        // subpasta (https://host/picoide/) sem o servidor saber o prefixo: o
        // Caddy tira o /picoide e o picoIDE continua vendo /api/... normal.
        const BASE = new URL('.', location.href);

        function url(caminho) {
            return new URL(caminho, BASE).toString();
        }

        function urlWs(caminho) {
            const u = new URL(caminho, BASE);
            u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            return u.toString();
        }

        // --- NAVEGAÇÃO DE TELEFONE ---
        // Arquivos, terminal e editor são páginas vizinhas. Só aceitamos o
        // gesto começando na borda: no meio da tela ele continuaria brigando
        // com a seleção e o scroll natural do xterm e do editor.
        const midiaMovel = window.matchMedia('(max-width: 700px)');
        let telaMovel = 'terminal';

        function estaNoMovel() { return midiaMovel.matches; }

        function trocarTelaMovel(destino) {
            if (!estaNoMovel()) return;
            if (!['files', 'terminal', 'editor'].includes(destino)) return;
            telaMovel = destino;
            document.body.classList.remove('mobile-files', 'mobile-terminal', 'mobile-editor');
            document.body.classList.add('mobile-' + destino);
            document.querySelectorAll('#mobile-pager button').forEach(b => {
                b.classList.toggle('ativo', b.dataset.tela === destino);
            });
            // Espera o fim do slide para o xterm medir a largura definitiva.
            setTimeout(() => {
                if (!estaNoMovel() || telaMovel !== destino) return;
                if (destino === 'terminal' && typeof ajustarVisiveis === 'function') {
                    ajustarVisiveis({ avisarShell: true });
                }
                if (destino === 'editor' && editor) editor.refresh();
            }, 210);
        }

        function atualizarModoMovel() {
            if (estaNoMovel()) trocarTelaMovel(telaMovel);
            else document.body.classList.remove('mobile-files', 'mobile-terminal', 'mobile-editor');
        }

        document.querySelectorAll('#mobile-pager button').forEach(b => {
            b.addEventListener('click', () => trocarTelaMovel(b.dataset.tela));
        });
        if (midiaMovel.addEventListener) midiaMovel.addEventListener('change', atualizarModoMovel);
        else midiaMovel.addListener(atualizarModoMovel);
        atualizarModoMovel();

        // --- MEMÓRIA DE SESSÃO (sobrevive ao F5) ---
        const CHAVES = {
            raiz: 'picoide.rootPath',
            pastas: 'picoide.openFolders',
            arquivo: 'picoide.currentFile',      // legado: um arquivo só
            arquivos: 'picoide.openFiles',
            sessao: 'picoide.terminalSession',    // legado: um terminal só
            terminais: 'picoide.terminals',
            tamanhos: 'picoide.paneSizes'
        };

        function lerMemoria(chave, padrao) {
            try {
                const bruto = localStorage.getItem(chave);
                return bruto === null ? padrao : JSON.parse(bruto);
            } catch (e) {
                return padrao;
            }
        }

        function gravarMemoria(chave, valor) {
            try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) { /* modo privado */ }
        }

        // --- EDITOR E AUTOSAVE ---
        const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
            lineNumbers: true, theme: "dracula", mode: "javascript"
        });

        let timeoutAutosave = null;
        let bloqueiaAutosaveInicial = true;

        // Cada arquivo aberto é uma aba com o seu próprio Doc do CodeMirror.
        // Guardar o Doc (em vez de só o texto) preserva cursor, seleção e
        // histórico de desfazer de cada arquivo ao alternar entre eles.
        const abertos = [];   // { path, name, doc, binario, sujo, revision, conflito, removido }
        let abaAtiva = -1;

        // Mantidos porque o resto da página (download, autosave) pergunta por
        // eles; são sempre o espelho da aba ativa.
        let arquivoAtual = "";
        let binarioAberto = false;

        // O meta.js do CodeMirror já conhece a tabela de extensões e nomes
        // (Dockerfile, Makefile, CMakeLists.txt...). Devolvemos o mime, e não o
        // nome do modo, porque o clike serve C, C++, Java e outros por mime.
        // Sem modo conhecido, texto puro: colorir .log como JavaScript, que era
        // o padrão antigo, deixava a tela pior do que sem realce nenhum.
        function modoDe(nome) {
            if (!CodeMirror.findModeByFileName) return "text/plain";
            // O nome vai como está: "Dockerfile" e "CMakeLists.txt" são casados
            // por expressão sensível a maiúsculas, e passar tudo em minúsculas
            // fazia os dois caírem em texto puro. As minúsculas ficam de
            // reserva, para extensões gritadas do tipo ARQUIVO.PY.
            const info = CodeMirror.findModeByFileName(nome)
                      || CodeMirror.findModeByFileName(nome.toLowerCase());
            return info ? (info.mime || info.mode) : "text/plain";
        }

        // Baixar só faz sentido com arquivo aberto; salvar, só se for texto.
        function atualizarBotoes() {
            const baixar = document.getElementById('btn-baixar-atual');
            const salvar = document.getElementById('btn-salvar');
            baixar.disabled = !arquivoAtual;
            baixar.style.opacity = arquivoAtual ? '1' : '0.4';
            salvar.disabled = binarioAberto || !arquivoAtual;
            salvar.style.opacity = (binarioAberto || !arquivoAtual) ? '0.4' : '1';
        }

        function salvarAbas() {
            gravarMemoria(CHAVES.arquivos, {
                lista: abertos.map(a => ({ path: a.path, name: a.name })),
                ativa: abaAtiva
            });
        }

        function desenharAbasArquivos() {
            const barra = document.getElementById('abas-arquivos');
            barra.innerHTML = '';
            abertos.forEach((a, i) => {
                const aba = document.createElement('div');
                aba.className = 'aba' + (i === abaAtiva ? ' ativa' : '');
                aba.onclick = () => ativarAba(i);

                const nome = document.createElement('span');
                const marca = a.conflito ? '⚠ ' : (a.removido ? '× ' : (a.sujo ? '• ' : ''));
                nome.textContent = marca + a.name;
                if (a.sujo || a.conflito || a.removido) nome.className = 'sujo';
                aba.appendChild(nome);

                const fechar = document.createElement('span');
                fechar.className = 'fechar';
                fechar.textContent = '×';
                fechar.title = 'Fechar ' + a.name;
                fechar.onclick = (e) => { e.stopPropagation(); fecharAba(i); };
                aba.appendChild(fechar);

                barra.appendChild(aba);
            });
        }

        function apresentarEstado(a) {
            if (!a) return;
            if (abertos[abaAtiva] === a) {
                const estado = a.conflito ? ' — conflito externo'
                             : a.removido ? ' — removido no disco'
                             : '';
                document.getElementById('current-file').textContent =
                    (a.binario ? `${a.name} (binário)` : a.name) + estado;

                const btn = document.getElementById('btn-salvar');
                if (a.conflito || a.removido) {
                    btn.textContent = a.conflito ? 'Resolver conflito' : 'Recriar arquivo';
                    btn.style.background = '#a1260d';
                }
                atualizarBotoes();
            }
            desenharAbasArquivos();
        }

        function ativarAba(i) {
            if (i < 0 || i >= abertos.length) return;
            const a = abertos[i];
            abaAtiva = i;
            arquivoAtual = a.path;
            binarioAberto = a.binario;

            // swapDoc troca o conteúdo sem recriar o editor, então o Doc de
            // cada aba continua guardando o seu próprio desfazer.
            bloqueiaAutosaveInicial = true;
            editor.swapDoc(a.doc);
            editor.setOption("mode", modoDe(a.name));
            editor.setOption("readOnly", a.binario);
            setTimeout(() => { bloqueiaAutosaveInicial = false; }, 100);

            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = "Salvar (Ctrl+S)";
            btnSalvar.style.background = "#0e639c";

            apresentarEstado(a);
            salvarAbas();
        }

        function fecharAba(i) {
            if (i < 0 || i >= abertos.length) return;
            abertos.splice(i, 1);

            if (!abertos.length) {
                abaAtiva = -1;
                arquivoAtual = "";
                binarioAberto = false;
                editor.swapDoc(CodeMirror.Doc("", "javascript"));
                editor.setOption("readOnly", false);
                document.getElementById('current-file').textContent = 'Nenhum arquivo aberto';
                atualizarBotoes();
                desenharAbasArquivos();
                salvarAbas();
                return;
            }
            ativarAba(Math.min(i, abertos.length - 1));
        }

        editor.on("change", () => {
            if (abaAtiva < 0 || bloqueiaAutosaveInicial) return;
            const alvo = abertos[abaAtiva];
            if (!alvo || alvo.binario || alvo.aplicandoExterno) return;

            alvo.sujo = true;
            desenharAbasArquivos();
            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = "Modificado...";
            btnSalvar.style.background = "#c77200";

            clearTimeout(timeoutAutosave);
            // O alvo vai preso no closure: se você trocar de aba antes dos 5s,
            // o autosave ainda grava o arquivo que foi editado, não o da vez.
            timeoutAutosave = setTimeout(() => { salvarArquivoDe(alvo, true); }, 5000);
        });

        document.addEventListener("keydown", function(e) {
            if ((window.navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)  && e.keyCode == 83) {
                e.preventDefault(); 
                clearTimeout(timeoutAutosave);
                salvarArquivo(false);
            }
        }, false);

        // --- SISTEMA DE ARQUIVOS COM AUTO-UPDATE ---

        // Memória inteligente: guarda os caminhos das pastas que você abriu
        const pastasAbertas = new Set(lerMemoria(CHAVES.pastas, []));
        const inputRaiz = document.getElementById('root-path-input');

        // Restaura a pasta da última visita antes do primeiro carregamento
        inputRaiz.value = lerMemoria(CHAVES.raiz, '/') || '/';

        function salvarPastasAbertas() {
            gravarMemoria(CHAVES.pastas, Array.from(pastasAbertas));
        }

        function mudarRaiz() {
            const novoCaminho = inputRaiz.value;
            gravarMemoria(CHAVES.raiz, novoCaminho);
            carregarArquivos(novoCaminho, document.getElementById('file-list'));
        }

        inputRaiz.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') mudarRaiz();
        });

        async function carregarArquivos(caminho, elementoPai) {
            // Evita o texto "Carregando" na raiz para não piscar a tela no auto-update
            if (elementoPai.id === 'file-list' && elementoPai.innerHTML === '') {
                elementoPai.innerHTML = 'Carregando...';
            }
            
            const res = await fetch(url(`api/files?path=${encodeURIComponent(caminho)}`));
            const files = await res.json();

            // Guarda os nomes da pasta aberta para o upload conseguir avisar
            // antes de sobrescrever algo.
            if (elementoPai.id === 'file-list') {
                nomesNaPasta.clear();
                files.forEach(f => { if (!f.is_dir) nomesNaPasta.add(f.name); });
            }

            // O que a árvore mostra é só nome e se é pasta, então isto resume
            // exatamente o que está na tela. Se não mudou, não repinta: trocar
            // o DOM à toa é o que faz a barra piscar a cada 10s, além de matar
            // a seleção de texto e a posição da rolagem.
            // O caminho entra na assinatura porque duas pastas diferentes podem
            // ter a mesma lista de nomes, e aí repintar é obrigatório.
            const assinatura = JSON.stringify([caminho, files.map(f => [f.name, f.is_dir])]);
            if (elementoPai.dataset.assinatura === assinatura) {
                // Nada novo aqui, mas uma subpasta aberta pode ter mudado.
                elementoPai
                    .querySelectorAll(':scope > .file-item > .folder-children')
                    .forEach(filho => {
                        if (filho.style.display !== 'none' && filho.dataset.caminho) {
                            carregarArquivos(filho.dataset.caminho, filho);
                        }
                    });
                return;
            }
            elementoPai.dataset.assinatura = assinatura;

            // Fragmento de documento permite montar a árvore na memória antes de jogar na tela (zero flicker)
            const fragment = document.createDocumentFragment();

            files.forEach(f => {
                const div = document.createElement('div');
                div.className = 'file-item ' + (f.is_dir ? 'is-dir' : '');
                const header = document.createElement('div');
                div.appendChild(header);

                if (f.is_dir) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'folder-children';
                    // Guardado no próprio nó para o refresh conseguir revisitar
                    // as subpastas abertas sem reconstruir a árvore.
                    childrenContainer.dataset.caminho = f.path;
                    
                    // Verifica se a pasta estava na memória de abertas
                    const isOpen = pastasAbertas.has(f.path);
                    header.textContent = (isOpen ? '📂 ' : '📁 ') + f.name;
                    childrenContainer.style.display = isOpen ? 'block' : 'none';
                    
                    div.appendChild(childrenContainer);

                    header.onclick = async (e) => {
                        e.stopPropagation();
                        if (childrenContainer.style.display === 'none') {
                            header.textContent = '📂 ' + f.name;
                            childrenContainer.style.display = 'block';
                            pastasAbertas.add(f.path);
                            salvarPastasAbertas();
                            await carregarArquivos(f.path, childrenContainer);
                        } else {
                            header.textContent = '📁 ' + f.name;
                            childrenContainer.style.display = 'none';
                            pastasAbertas.delete(f.path);
                            salvarPastasAbertas();
                            childrenContainer.innerHTML = '';
                            delete childrenContainer.dataset.assinatura;
                        }
                    };

                    // Se a pasta já estava aberta antes do refresh, busca os filhos dela silenciosamente
                    if (isOpen) {
                        carregarArquivos(f.path, childrenContainer);
                    }
                } else {
                    header.textContent = '📄 ' + f.name;
                    header.onclick = (e) => { e.stopPropagation(); abrirArquivo(f.path, f.name); };
                }
                fragment.appendChild(div);
            });

            elementoPai.innerHTML = '';
            elementoPai.appendChild(fragment);
        }

        // --- UPLOAD E DOWNLOAD ---

        // Um <a download> deixa o próprio navegador cuidar do salvamento, com
        // barra de progresso e sem passar o arquivo pela memória do JS.
        function baixarArquivo(caminho) {
            const a = document.createElement('a');
            a.href = url(`api/download?path=${encodeURIComponent(caminho)}`);
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function baixarAtual() {
            if (!arquivoAtual) return;
            baixarArquivo(arquivoAtual);
        }

        function avisar(texto) {
            document.getElementById('status-upload').textContent = texto;
        }

        // Nomes já presentes na pasta aberta, para avisar antes de sobrescrever.
        const nomesNaPasta = new Set();

        async function enviarArquivos(lista) {
            const arquivos = Array.from(lista);
            if (!arquivos.length) return;

            const pasta = inputRaiz.value || '/';
            const base = pasta.endsWith('/') ? pasta : pasta + '/';
            let enviados = 0;

            for (const arquivo of arquivos) {
                if (nomesNaPasta.has(arquivo.name) &&
                    !confirm(`Já existe "${arquivo.name}" nesta pasta. Substituir?`)) {
                    continue;
                }

                avisar(`Enviando ${arquivo.name}...`);
                try {
                    const res = await fetch(
                        url(`api/upload?path=${encodeURIComponent(base + arquivo.name)}`),
                        { method: 'POST', body: arquivo });
                    if (!res.ok) {
                        avisar(`Falhou ${arquivo.name}: ${await res.text()}`);
                        return;
                    }
                    enviados++;
                } catch (e) {
                    avisar(`Falhou ${arquivo.name}: ${e}`);
                    return;
                }
            }

            avisar(enviados ? `${enviados} arquivo(s) enviado(s).` : '');
            mudarRaiz();
            setTimeout(() => avisar(''), 4000);
        }

        document.getElementById('input-arquivos').addEventListener('change', (e) => {
            enviarArquivos(e.target.files);
            e.target.value = '';  // permite reenviar o mesmo arquivo depois
        });

        // Arrastar da máquina para a barra lateral envia para a pasta aberta.
        const sidebar = document.getElementById('sidebar');
        ['dragenter', 'dragover'].forEach(ev => sidebar.addEventListener(ev, (e) => {
            e.preventDefault();
            sidebar.classList.add('soltando');
        }));
        ['dragleave', 'drop'].forEach(ev => sidebar.addEventListener(ev, (e) => {
            e.preventDefault();
            sidebar.classList.remove('soltando');
        }));
        sidebar.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files.length) {
                enviarArquivos(e.dataTransfer.files);
            }
        });

        async function abrirArquivo(caminho, nome, mostrarNoMovel = true) {
            // Já aberto: traz para a frente e confere o disco. A conferência
            // nunca descarta uma edição local; nesse caso ela marca conflito.
            const existente = abertos.findIndex(a => a.path === caminho);
            if (existente >= 0) {
                ativarAba(existente);
                atualizarArquivoAberto(abertos[existente]);
                if (mostrarNoMovel) trocarTelaMovel('editor');
                return;
            }

            const res = await fetch(url(`api/read?path=${encodeURIComponent(caminho)}`));

            if (res.status === 415) {
                // Binário: o editor não tem o que mostrar, mas o arquivo é
                // real e vira uma aba mesmo assim — é assim que dá para
                // baixá-lo, que é o jeito de tirar um build do servidor.
                abertos.push({
                    path: caminho, name: nome, binario: true, sujo: false,
                    revision: null, conflito: false, removido: false,
                    doc: CodeMirror.Doc("Arquivo binário", "javascript")
                });
                ativarAba(abertos.length - 1);
                if (mostrarNoMovel) trocarTelaMovel('editor');
                return;
            }
            if (!res.ok) {
                // Arquivo sumiu: não vira aba, senão o autosave o recriaria.
                document.getElementById('current-file').textContent = `${nome} (não encontrado)`;
                return;
            }

            const texto = await res.text();
            abertos.push({
                path: caminho, name: nome, binario: false, sujo: false,
                revision: res.headers.get('etag'), conflito: false, removido: false,
                doc: CodeMirror.Doc(texto, modoDe(nome))
            });
            ativarAba(abertos.length - 1);
            if (mostrarNoMovel) trocarTelaMovel('editor');
        }

        async function salvarArquivoDe(alvo, isAuto = false) {
            // Salvar um binário gravaria o texto do aviso por cima dele.
            if (!alvo || alvo.binario) return;

            const precisaConfirmar = alvo.conflito || alvo.removido;
            if (precisaConfirmar && isAuto) {
                apresentarEstado(alvo);
                return;
            }
            if (precisaConfirmar && !confirm(
                alvo.removido
                    ? `"${alvo.name}" foi removido no disco. Recriar com o conteúdo do editor?`
                    : `"${alvo.name}" mudou fora do picoIDE. Sobrescrever a versão do disco?`
            )) return;

            const btnSalvar = document.getElementById("btn-salvar");
            const eraOAtivo = abertos[abaAtiva] === alvo;
            if (eraOAtivo) btnSalvar.textContent = isAuto ? "Autosalvando..." : "Salvando...";

            const res = await fetch(url('api/save'), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    path: alvo.path,
                    content: alvo.doc.getValue(),
                    // null é uma sobrescrita explicitamente confirmada.
                    revision: precisaConfirmar ? null : alvo.revision
                })
            });

            if (res.status === 409) {
                alvo.conflito = true;
                apresentarEstado(alvo);
                return;
            }
            if (!res.ok) {
                if (eraOAtivo) {
                    btnSalvar.textContent = 'Erro ao salvar';
                    btnSalvar.style.background = '#a1260d';
                }
                return;
            }

            alvo.revision = res.headers.get('etag');
            alvo.sujo = false;
            alvo.conflito = false;
            alvo.removido = false;
            desenharAbasArquivos();

            if (eraOAtivo) {
                btnSalvar.textContent = "Salvo!";
                btnSalvar.style.background = "#2a7522";
                setTimeout(() => {
                    if (btnSalvar.textContent === "Salvo!") {
                        btnSalvar.textContent = "Salvar (Ctrl+S)";
                        btnSalvar.style.background = "#0e639c";
                    }
                }, 2000);
            }

            // Dispara um refresh silencioso da árvore ao salvar
            mudarRaiz();
        }

        function salvarArquivo(isAuto = false) {
            return salvarArquivoDe(abertos[abaAtiva], isAuto);
        }

        let atualizandoAbertos = false;

        async function atualizarArquivoAberto(alvo) {
            if (!alvo || alvo.binario) return;
            const headers = {};
            if (alvo.revision) headers['If-None-Match'] = alvo.revision;

            let res;
            try {
                res = await fetch(url(`api/read?path=${encodeURIComponent(alvo.path)}`), { headers });
            } catch (_) {
                return; // uma queda de rede não transforma a aba em conflito
            }

            if (res.status === 304) return;
            if (res.status === 404) {
                alvo.removido = true;
                if (alvo.sujo) alvo.conflito = true;
                apresentarEstado(alvo);
                return;
            }
            if (!res.ok) return;

            const texto = await res.text();
            const novaRevision = res.headers.get('etag');
            if (alvo.sujo) {
                alvo.conflito = true;
                apresentarEstado(alvo);
                return;
            }

            const eraOAtivo = abertos[abaAtiva] === alvo;
            const cursor = eraOAtivo ? editor.getCursor() : null;
            const scroll = eraOAtivo ? editor.getScrollInfo() : null;
            alvo.aplicandoExterno = true;
            alvo.doc.setValue(texto);
            alvo.aplicandoExterno = false;
            alvo.revision = novaRevision;
            alvo.conflito = false;
            alvo.removido = false;
            if (eraOAtivo) {
                editor.setCursor(cursor);
                editor.scrollTo(scroll.left, scroll.top);
                apresentarEstado(alvo);
            } else {
                desenharAbasArquivos();
            }
        }

        async function atualizarArquivosAbertos() {
            if (atualizandoAbertos) return;
            atualizandoAbertos = true;
            try {
                await Promise.all(Array.from(abertos, atualizarArquivoAberto));
            } finally {
                atualizandoAbertos = false;
            }
        }

        // --- GATILHOS DE AUTO-UPDATE ---
        
        atualizarBotoes();

        // Gatilho 1: Início — já na pasta que estava aberta antes do F5
        mudarRaiz();

        // Reabre as abas em que você estava trabalhando. O formato antigo
        // guardava um arquivo só; ler os dois evita perder a aba de quem
        // atualizou o binário.
        (async () => {
            const salvas = lerMemoria(CHAVES.arquivos, null);
            let lista = salvas && salvas.lista ? salvas.lista : [];
            if (!lista.length) {
                const legado = lerMemoria(CHAVES.arquivo, null);
                if (legado && legado.path) lista = [legado];
            }
            for (const a of lista) {
                if (a && a.path) await abrirArquivo(a.path, a.name, false);
            }
            const ativa = salvas ? salvas.ativa : 0;
            if (abertos.length && ativa >= 0 && ativa < abertos.length) ativarAba(ativa);
        })();

        // Gatilho 2: Atualização silenciosa a cada 10 segundos, mas apenas se você estiver com a tela ativa
        setInterval(() => {
            if (document.visibilityState === 'visible') {
                mudarRaiz();
                atualizarArquivosAbertos();
            }
        }, 10000);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                mudarRaiz();
                atualizarArquivosAbertos();
            }
        });

        // --- TERMINAIS ---
        // O servidor já mantém uma sessão por id; aqui cada aba é uma sessão.
        //
        // A área do terminal não é uma lista de abas, e sim uma ÁRVORE de
        // painéis, para dar dois (ou quatro) terminais à vista ao mesmo tempo:
        //
        //   grupo   { tipo:'grupo',   abas:[id...], ativa:id }
        //   divisão { tipo:'divisao', dir:'linha'|'coluna', filhos:[...], fracoes:[...] }
        //
        // Cada grupo é uma folha com a sua própria barra de abas; arrastar uma
        // aba para a borda de um painel o divide, e para o meio só a muda de
        // painel. As frações guardam a repartição do espaço entre irmãos, que é
        // o que as divisórias internas movem.
        const terminais = [];   // { id, term, fit, ws, sessao, tentativas, encerrado, tela }
        let layout = null;      // raiz da árvore
        let proximoId = 1;      // vira o "Terminal N" da aba; nunca é reusado
        let focoTerminal = null;

        // A Clipboard API só existe em contexto seguro. Acessar o servidor por
        // http://IP-DA-MAQUINA:8080 NÃO é contexto seguro (só localhost e
        // https são), então o caminho antigo com execCommand precisa continuar
        // aqui: é ele que roda no uso real.
        async function copiarSelecao(term) {
            const texto = term.getSelection();
            if (!texto) return;

            const anterior = document.activeElement;
            try {
                if (window.isSecureContext && navigator.clipboard) {
                    await navigator.clipboard.writeText(texto);
                } else {
                    const area = document.createElement('textarea');
                    area.value = texto;
                    area.style.position = 'fixed';
                    area.style.opacity = '0';
                    document.body.appendChild(area);
                    area.select();
                    document.execCommand('copy');
                    area.remove();
                }
            } catch (e) { /* navegador negou; a seleção continua lá para o botão direito */ }

            // Devolve o foco a quem tinha: copiar não pode tirar o teclado do
            // terminal, nem roubá-lo de outro campo em que você estava.
            if (anterior && anterior.focus) anterior.focus();
        }

        // Só para o Ctrl+Shift+V: o navegador não dispara colar nativo nessa
        // combinação, então aqui não tem como fugir da Clipboard API.
        async function colarDaApi(term) {
            try {
                if (window.isSecureContext && navigator.clipboard) {
                    const texto = await navigator.clipboard.readText();
                    if (texto) term.paste(texto);
                }
            } catch (e) { /* sem permissão: resta o Ctrl+V, que usa o caminho nativo */ }
        }

        // --- A ÁRVORE DE PAINÉIS ---

        function terminalPor(id) {
            return terminais.find(t => t.id === id) || null;
        }

        function percorrer(no, fn, pai) {
            if (!no) return;
            fn(no, pai || null);
            if (no.tipo === 'divisao') no.filhos.forEach(f => percorrer(f, fn, no));
        }

        function gruposDoLayout() {
            const achados = [];
            percorrer(layout, no => { if (no.tipo === 'grupo') achados.push(no); });
            return achados;
        }

        function paiDe(no) {
            let pai = null;
            percorrer(layout, (atual, acima) => { if (atual === no) pai = acima; });
            return pai;
        }

        function grupoDe(id) {
            return gruposDoLayout().find(g => g.abas.includes(id)) || null;
        }

        // Põe `novo` no lugar de `velho`. Uma divisão que entra na mesma direção
        // do pai é achatada: sem isso a árvore ganha camadas que se comportam
        // igual, e as frações de cada nível deixam de bater com a tela.
        function substituirNo(velho, novo) {
            const pai = paiDe(velho);
            if (!pai) { layout = novo; return; }
            const i = pai.filhos.indexOf(velho);
            if (novo.tipo === 'divisao' && novo.dir === pai.dir) {
                const fatia = pai.fracoes[i];
                const soma = novo.fracoes.reduce((a, b) => a + b, 0);
                pai.filhos.splice(i, 1, ...novo.filhos);
                pai.fracoes.splice(i, 1, ...novo.fracoes.map(f => f / soma * fatia));
            } else {
                pai.filhos[i] = novo;
            }
        }

        function tirarNo(no) {
            const pai = paiDe(no);
            if (!pai) { layout = null; return; }
            const i = pai.filhos.indexOf(no);
            pai.filhos.splice(i, 1);
            const fatia = pai.fracoes.splice(i, 1)[0];
            // A fatia vai para o vizinho: o painel que sai devolve o espaço a
            // quem estava do lado, em vez de espremer todo mundo de novo.
            const vizinho = Math.min(i, pai.filhos.length - 1);
            if (vizinho >= 0) pai.fracoes[vizinho] += fatia;
            // Divisão de um filho só não divide nada: some e promove o filho.
            if (pai.filhos.length === 1) substituirNo(pai, pai.filhos[0]);
        }

        function tirarAba(id) {
            const grupo = grupoDe(id);
            if (!grupo) return;
            const i = grupo.abas.indexOf(id);
            grupo.abas.splice(i, 1);
            if (grupo.ativa === id) {
                grupo.ativa = grupo.abas[Math.min(i, grupo.abas.length - 1)];
            }
            if (!grupo.abas.length) tirarNo(grupo);
        }

        function moverParaGrupo(destino, id) {
            if (grupoDe(id) === destino) { destino.ativa = id; return; }
            tirarAba(id);
            destino.abas.push(id);
            destino.ativa = id;
        }

        // lado: 'esq' | 'dir' | 'cima' | 'baixo'
        function dividir(alvo, lado, id) {
            // Um painel sem nenhuma aba (a tela vazia) não tem o que dividir.
            if (!alvo.abas.length) { moverParaGrupo(alvo, id); return; }
            const origem = grupoDe(id);
            // Sozinha no painel, a aba já ocupa aquele espaço inteiro: dividir
            // seria movê-la para onde ela está, deixando um painel vazio.
            if (origem === alvo && origem.abas.length === 1) return;

            const dir = (lado === 'esq' || lado === 'dir') ? 'linha' : 'coluna';
            const antes = (lado === 'esq' || lado === 'cima');
            tirarAba(id);
            const novo = { tipo: 'grupo', abas: [id], ativa: id };
            const pai = paiDe(alvo);
            if (pai && pai.dir === dir) {
                // Já há irmãos nessa direção: entra como mais um, repartindo o
                // espaço só com o painel em que você soltou.
                const i = pai.filhos.indexOf(alvo);
                const meio = pai.fracoes[i] / 2;
                pai.fracoes[i] = meio;
                pai.filhos.splice(antes ? i : i + 1, 0, novo);
                pai.fracoes.splice(antes ? i : i + 1, 0, meio);
            } else {
                substituirNo(alvo, {
                    tipo: 'divisao', dir,
                    filhos: antes ? [novo, alvo] : [alvo, novo],
                    fracoes: [0.5, 0.5]
                });
            }
        }

        // --- DESENHO DA ÁRVORE ---

        function montarAba(grupo, t) {
            const aba = document.createElement('div');
            aba.className = 'aba' + (t.id === grupo.ativa ? ' ativa' : '');
            aba.title = 'Arraste para a borda de um painel para dividir a tela';

            const nome = document.createElement('span');
            nome.textContent = `Terminal ${t.id}`;
            aba.appendChild(nome);

            const fechar = document.createElement('span');
            fechar.className = 'fechar';
            fechar.textContent = '×';
            fechar.title = 'Encerrar este terminal';
            fechar.onclick = (e) => { e.stopPropagation(); fecharTerminal(t.id); };
            aba.appendChild(fechar);

            aba.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || e.target === fechar) return;
                arrastarAba(e, t.id);
            });
            // O clique que fecha o arrasto não pode reativar a aba de origem.
            aba.onclick = () => { if (!arrastouAba) ativarTerminal(t.id); };
            return aba;
        }

        function botaoDaBarra(classe, texto, titulo, acao) {
            const b = document.createElement('button');
            b.className = classe;
            b.textContent = texto;
            b.title = titulo;
            b.onclick = acao;
            return b;
        }

        function montarGrupo(no) {
            const caixa = document.createElement('div');
            caixa.className = 'grupo-terminal';
            // O arrasto de aba precisa voltar do elemento para o nó da árvore.
            caixa.no = no;

            const barra = document.createElement('div');
            barra.className = 'barra-abas abas-terminais';
            const telas = document.createElement('div');
            telas.className = 'telas-terminais';

            no.abas.forEach(id => {
                const t = terminalPor(id);
                if (!t) return;
                barra.appendChild(montarAba(no, t));
                t.tela.classList.toggle('ativa', id === no.ativa);
                telas.appendChild(t.tela);
            });

            barra.appendChild(botaoDaBarra('nova-aba', '+', 'Novo terminal neste painel', () => {
                const t = criarTerminal(null);
                moverParaGrupo(no, t.id);
                focoTerminal = t.id;
                aplicarLayout();
            }));
            barra.appendChild(botaoDaBarra('dividir-aba', '⊞', 'Dividir: novo terminal ao lado', () => {
                const t = criarTerminal(null);
                dividir(no, 'dir', t.id);
                focoTerminal = t.id;
                aplicarLayout();
            }));

            caixa.appendChild(barra);
            caixa.appendChild(telas);
            if (grupoDe(focoTerminal) === no) caixa.classList.add('foco');
            return caixa;
        }

        function montarNo(no) {
            if (no.tipo === 'grupo') return montarGrupo(no);
            const caixa = document.createElement('div');
            caixa.className = 'divisao ' + no.dir;
            no.filhos.forEach((filho, i) => {
                if (i > 0) {
                    const divisoria = document.createElement('div');
                    divisoria.className = 'divisoria';
                    divisoria.title = 'Arraste para redimensionar';
                    arrastarInterno(divisoria, no, i);
                    caixa.appendChild(divisoria);
                }
                const el = montarNo(filho);
                el.style.flexGrow = no.fracoes[i];
                caixa.appendChild(el);
            });
            return caixa;
        }

        // Redesenha a árvore inteira. As telas são MOVIDAS para o depósito e de
        // volta, nunca recriadas: recriar mataria o xterm, o scrollback e a
        // conexão de cada terminal a cada rearranjo.
        function aplicarLayout() {
            if (!layout) layout = { tipo: 'grupo', abas: [], ativa: undefined };
            if (!grupoDe(focoTerminal)) {
                const primeiro = gruposDoLayout()[0];
                focoTerminal = primeiro ? primeiro.ativa : null;
            }

            const deposito = document.getElementById('deposito-telas');
            terminais.forEach(t => deposito.appendChild(t.tela));
            const raiz = document.getElementById('painel-terminais');
            raiz.innerHTML = '';
            raiz.appendChild(montarNo(layout));

            ajustarVisiveis({ avisarShell: true });
            const t = terminalPor(focoTerminal);
            // Os testes e o resto da página falam com o terminal em foco.
            window.term = t ? t.term : null;
            if (t) t.term.focus();
            salvarTerminais();
        }

        // Só o terminal da frente de cada painel ocupa tela; os escondidos se
        // reajustam quando voltam.
        function terminaisVisiveis() {
            return gruposDoLayout().map(g => terminalPor(g.ativa)).filter(Boolean);
        }

        function ajustarVisiveis({ avisarShell }) {
            terminaisVisiveis().forEach(t => {
                t.fit.fit();
                if (avisarShell) sincronizarTamanho(t);
            });
        }

        // Ajustar quatro xterms a cada mousemove trava o arrasto; um por quadro
        // já acompanha o ponteiro.
        let quadroAjuste = null;
        function agendarAjuste() {
            if (quadroAjuste) return;
            quadroAjuste = requestAnimationFrame(() => {
                quadroAjuste = null;
                ajustarVisiveis({ avisarShell: false });
            });
        }

        function marcarFoco() {
            const alvo = grupoDe(focoTerminal);
            document.querySelectorAll('.grupo-terminal').forEach(el => {
                el.classList.toggle('foco', el.no === alvo);
            });
        }

        // --- ARRASTAR ABA PARA DIVIDIR ---
        // Arrasto próprio, com mousedown/mousemove, e não a API de drag-and-drop
        // do HTML: os eventos dela se perdem por cima do xterm, e aqui já existe
        // a capa de arrasto que impede o movimento de virar seleção de texto.
        let arrastouAba = false;

        function retangulosDosGrupos() {
            return Array.from(document.querySelectorAll('.grupo-terminal')).map(el => ({
                no: el.no,
                caixa: el.getBoundingClientRect(),
                telas: el.querySelector('.telas-terminais').getBoundingClientRect()
            }));
        }

        // Onde a aba cairia se você soltasse agora: perto de uma borda, divide
        // por ali; no meio (ou na barra de abas), só muda de painel.
        function alvoDaSolta(alvos, x, y) {
            for (const alvo of alvos) {
                const c = alvo.caixa;
                if (x < c.left || x > c.right || y < c.top || y > c.bottom) continue;
                const r = alvo.telas;
                // Painel minúsculo não tem borda que se distinga do meio.
                if (y < r.top || r.width < 120 || r.height < 80) {
                    return Object.assign({}, alvo, { lado: 'centro' });
                }
                const bordas = [
                    ['esq', (x - r.left) / r.width],
                    ['dir', (r.right - x) / r.width],
                    ['cima', (y - r.top) / r.height],
                    ['baixo', (r.bottom - y) / r.height]
                ].sort((a, b) => a[1] - b[1]);
                const lado = bordas[0][1] < 0.3 ? bordas[0][0] : 'centro';
                return Object.assign({}, alvo, { lado });
            }
            return null;
        }

        function areaDoAlvo(alvo) {
            const r = alvo.telas;
            const meia = { left: r.left, top: r.top, width: r.width, height: r.height };
            if (alvo.lado === 'esq' || alvo.lado === 'dir') meia.width = r.width / 2;
            if (alvo.lado === 'cima' || alvo.lado === 'baixo') meia.height = r.height / 2;
            if (alvo.lado === 'dir') meia.left = r.left + r.width / 2;
            if (alvo.lado === 'baixo') meia.top = r.top + r.height / 2;
            return meia;
        }

        function arrastarAba(evento, id) {
            const x0 = evento.clientX, y0 = evento.clientY;
            const fantasma = document.getElementById('fantasma-aba');
            const indicador = document.getElementById('indicador-solta');
            let arrastando = false, alvos = null, alvo = null;

            const mover = (ev) => {
                if (!arrastando) {
                    // Uns pixels de folga: sem isso um clique com a mão trêmula
                    // viraria arrasto, e trocar de aba ficaria imprevisível.
                    if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 6) return;
                    arrastando = true;
                    arrastouAba = true;
                    document.body.classList.add('arrastando-aba');
                    // Medido uma vez: durante o arrasto o layout não muda.
                    alvos = retangulosDosGrupos();
                    fantasma.textContent = `Terminal ${id}`;
                    fantasma.style.display = 'block';
                }
                fantasma.style.left = (ev.clientX + 12) + 'px';
                fantasma.style.top = (ev.clientY + 12) + 'px';

                alvo = alvoDaSolta(alvos, ev.clientX, ev.clientY);
                if (!alvo) { indicador.style.display = 'none'; return; }
                const area = areaDoAlvo(alvo);
                indicador.style.display = 'block';
                indicador.style.left = area.left + 'px';
                indicador.style.top = area.top + 'px';
                indicador.style.width = area.width + 'px';
                indicador.style.height = area.height + 'px';
            };

            const soltar = () => {
                document.removeEventListener('mousemove', mover);
                document.removeEventListener('mouseup', soltar);
                if (!arrastando) return;
                document.body.classList.remove('arrastando-aba');
                fantasma.style.display = 'none';
                indicador.style.display = 'none';
                if (alvo) {
                    if (alvo.lado === 'centro') moverParaGrupo(alvo.no, id);
                    else dividir(alvo.no, alvo.lado, id);
                    focoTerminal = id;
                    aplicarLayout();
                }
                // Solta a trava do clique só depois que ele já passou.
                setTimeout(() => { arrastouAba = false; }, 0);
            };

            document.addEventListener('mousemove', mover);
            document.addEventListener('mouseup', soltar);
        }

        // --- DIVISÓRIAS ENTRE PAINÉIS ---
        // Cada divisória reparte espaço só entre os dois painéis que ela separa;
        // o resto da linha (ou coluna) fica onde está.
        function arrastarInterno(elemento, no, i) {
            elemento.addEventListener('mousedown', (e) => {
                e.preventDefault();
                document.body.classList.add('arrastando');

                const linha = no.dir === 'linha';
                const caixa = elemento.parentElement.getBoundingClientRect();
                const util = (linha ? caixa.width : caixa.height) - 5 * (no.filhos.length - 1);
                const soma = no.fracoes.reduce((a, b) => a + b, 0);
                const antes = i - 1, depois = i;
                const pxAntes = no.fracoes[antes] / soma * util;
                const pxDepois = no.fracoes[depois] / soma * util;
                const inicio = linha ? e.clientX : e.clientY;
                const elAntes = elemento.previousElementSibling;
                const elDepois = elemento.nextElementSibling;
                let finalAntes = pxAntes, finalDepois = pxDepois;

                const mover = (ev) => {
                    const d = (linha ? ev.clientX : ev.clientY) - inicio;
                    // Piso de 60px: um painel que chega a zero some da tela e
                    // não sobra divisória para puxá-lo de volta.
                    const preso = Math.max(60 - pxAntes, Math.min(d, pxDepois - 60));
                    finalAntes = pxAntes + preso;
                    finalDepois = pxDepois - preso;
                    elAntes.style.flexGrow = finalAntes / util * soma;
                    elDepois.style.flexGrow = finalDepois / util * soma;
                    agendarAjuste();
                };

                const soltar = () => {
                    document.removeEventListener('mousemove', mover);
                    document.removeEventListener('mouseup', soltar);
                    document.body.classList.remove('arrastando');
                    no.fracoes[antes] = finalAntes / util * soma;
                    no.fracoes[depois] = finalDepois / util * soma;
                    // Agora sim os shells são avisados, uma vez só.
                    ajustarVisiveis({ avisarShell: true });
                    salvarTerminais();
                };

                document.addEventListener('mousemove', mover);
                document.addEventListener('mouseup', soltar);
            });
        }

        // --- MEMÓRIA DOS TERMINAIS ---
        // O que vai para o localStorage é a árvore com as SESSÕES no lugar dos
        // ids: id é numeração desta visita, sessão é o que o servidor conhece.
        function serializar(no) {
            if (no.tipo === 'grupo') {
                // Sessão nula = shell que já morreu; guardá-la faria a próxima
                // visita abrir um painel para um terminal que não existe mais.
                const vivos = no.abas.map(id => terminalPor(id)).filter(t => t && t.sessao);
                if (!vivos.length) return null;
                const ativa = terminalPor(no.ativa);
                return {
                    tipo: 'grupo',
                    sessoes: vivos.map(t => t.sessao),
                    ativa: (ativa && ativa.sessao) || vivos[0].sessao
                };
            }
            const filhos = [], fracoes = [];
            no.filhos.forEach((filho, i) => {
                const parte = serializar(filho);
                if (parte) { filhos.push(parte); fracoes.push(no.fracoes[i]); }
            });
            if (!filhos.length) return null;
            if (filhos.length === 1) return filhos[0];
            return { tipo: 'divisao', dir: no.dir, filhos, fracoes };
        }

        function salvarTerminais() {
            const foco = terminalPor(focoTerminal);
            gravarMemoria(CHAVES.terminais, {
                // Um terminal pode se anunciar antes de a árvore existir, na
                // restauração; aí não há layout nenhum para gravar ainda.
                layout: layout ? serializar(layout) : null,
                foco: foco ? foco.sessao : null
            });
        }

        // O que vem do localStorage pode estar velho ou corrompido, então nada
        // aqui confia no formato: nó que não se entende vira null e é podado.
        function restaurar(no) {
            if (!no || typeof no !== 'object') return null;
            if (no.tipo === 'divisao' && Array.isArray(no.filhos)) {
                const filhos = [], fracoes = [];
                no.filhos.forEach((filho, i) => {
                    const parte = restaurar(filho);
                    if (!parte) return;
                    filhos.push(parte);
                    const f = Array.isArray(no.fracoes) ? no.fracoes[i] : 1;
                    fracoes.push(typeof f === 'number' && f > 0 ? f : 1);
                });
                if (!filhos.length) return null;
                if (filhos.length === 1) return filhos[0];
                return {
                    tipo: 'divisao', dir: no.dir === 'coluna' ? 'coluna' : 'linha',
                    filhos, fracoes
                };
            }
            const sessoes = Array.isArray(no.sessoes) ? no.sessoes.filter(s => s) : [];
            if (!sessoes.length) return null;
            const ids = sessoes.map(s => criarTerminal(s).id);
            const i = sessoes.indexOf(no.ativa);
            return { tipo: 'grupo', abas: ids, ativa: ids[i >= 0 ? i : 0] };
        }

        async function fecharTerminal(id) {
            const t = terminalPor(id);
            if (!t) return;

            // Fechar a aba encerra a sessão de vez: diferente de fechar a
            // página, aqui a intenção é matar o shell, não deixá-lo rodando.
            if (t.sessao) {
                try {
                    await fetch(url(`api/terminal/encerrar?sessao=${encodeURIComponent(t.sessao)}`),
                                { method: 'POST' });
                } catch (e) { /* servidor fora do ar; a aba fecha do mesmo jeito */ }
            }
            if (t.ws) { t.ws.onclose = null; t.ws.close(); }
            t.term.dispose();
            t.tela.remove();
            terminais.splice(terminais.indexOf(t), 1);
            tirarAba(id);
            aplicarLayout();
        }

        function sincronizarTamanho(t) {
            if (t && t.ws && t.ws.readyState === WebSocket.OPEN) {
                t.ws.send(JSON.stringify({ type: "resize", cols: t.term.cols, rows: t.term.rows }));
            }
        }

        function ativarTerminal(id) {
            const grupo = grupoDe(id);
            if (!grupo) return;
            grupo.ativa = id;
            focoTerminal = id;
            aplicarLayout();
        }

        function conectar(t) {
            // Manda a pasta atual para o shell nascer nela, e não na raiz.
            const cwd = encodeURIComponent(inputRaiz.value || '/');
            // O cwd só vale para shell novo; reatando, o servidor ignora e o
            // shell continua na pasta onde ele já estava.
            let caminho = `api/ws?cwd=${cwd}`;
            if (t.sessao) caminho += `&sessao=${encodeURIComponent(t.sessao)}`;
            t.ws = new WebSocket(urlWs(caminho));

            t.ws.onopen = () => {
                t.encerrado = false;
                t.fit.fit();
                sincronizarTamanho(t);
            };

            // O servidor abre a conversa dizendo qual sessão nos coube, e só
            // depois manda o histórico e a saída ao vivo.
            function tratarAnuncio(texto) {
                let msg;
                try { msg = JSON.parse(texto); } catch (e) { return false; }
                if (!msg || msg.type !== 'sessao') return false;

                t.sessao = msg.id;
                salvarTerminais();

                if (msg.reatou) {
                    // Limpa antes de repintar: o histórico que vem a seguir é
                    // a tela inteira da sessão, e sem isso ela sairia duplicada
                    // por cima do que já estava aqui.
                    t.term.reset();
                    t.term.write(t.tentativas > 0
                        ? '\x1b[32m[picoIDE] Reconectado.\x1b[0m\r\n'
                        : '\x1b[32m[picoIDE] Sessão retomada.\x1b[0m\r\n');
                } else {
                    t.term.write(t.tentativas > 0
                        ? '\r\n\x1b[32m[picoIDE] Reconectado com um shell novo.\x1b[0m\r\n'
                        : '\x1b[32m[picoIDE] Shell conectado.\x1b[0m\r\n');
                }
                t.tentativas = 0;
                return true;
            }

            t.ws.onmessage = (evt) => {
                if (evt.data instanceof Blob) {
                    evt.data.arrayBuffer().then(buf => t.term.write(new Uint8Array(buf)));
                } else if (evt.data instanceof ArrayBuffer) {
                    t.term.write(new Uint8Array(evt.data));
                } else if (!tratarAnuncio(evt.data)) {
                    t.term.write(evt.data);
                }
            };

            t.ws.onclose = (evt) => {
                // Fechamento limpo = o shell terminou (exit / Ctrl+D). Nesse caso
                // reconectar sozinho só abriria um shell novo sem você pedir.
                if (evt.wasClean) {
                    t.encerrado = true;
                    // A sessão morreu de verdade: esquecer o id, senão a
                    // próxima visita tentaria reatar num shell que não existe.
                    t.sessao = null;
                    salvarTerminais();
                    t.term.write('\r\n\x1b[33m[picoIDE] Sessão encerrada. Aperte Enter para abrir um shell novo.\x1b[0m\r\n');
                    return;
                }
                // Queda de rede: volta sozinho, com espera crescente até 10s.
                const espera = Math.min(1000 * Math.pow(2, t.tentativas), 10000);
                t.tentativas++;
                t.term.write(`\r\n\x1b[31m[picoIDE] Conexão perdida. Reconectando em ${espera / 1000}s...\x1b[0m\r\n`);
                setTimeout(() => conectar(t), espera);
            };
        }

        function criarTerminal(sessao) {
            const tela = document.createElement('div');
            tela.className = 'terminal-tela';
            // Nasce no depósito; quem o coloca num painel é o aplicarLayout.
            document.getElementById('deposito-telas').appendChild(tela);

            const term = new Terminal({
                theme: { background: '#000' }, fontFamily: 'monospace', fontSize: 14, cursorBlink: true
            });
            const fit = new FitAddon.FitAddon();
            term.loadAddon(fit);
            term.open(tela);

            const t = { id: proximoId++, term, fit, ws: null, sessao, tentativas: 0, encerrado: false, tela };
            terminais.push(t);

            // Quem tem o teclado define o painel em foco: com dois terminais à
            // vista, clicar num deles precisa trocar o alvo do window.term.
            term.textarea.addEventListener('focus', () => {
                if (focoTerminal === t.id) return;
                focoTerminal = t.id;
                window.term = term;
                marcarFoco();
                salvarTerminais();
            });

            // Copiar é ao selecionar, como no ttyd: no terminal o Ctrl+C já
            // significa interromper o processo, e sobrecarregar essa tecla
            // deixaria a mais importante das duas funções ambígua.
            let timerCopia = null;
            term.onSelectionChange(() => {
                clearTimeout(timerCopia);
                if (!term.hasSelection()) return;
                // Espera a seleção assentar: copiar no meio do arrasto mexeria
                // no foco e cancelaria a seleção que está sendo feita.
                timerCopia = setTimeout(() => copiarSelecao(term), 200);
            });

            // Colar continua no Ctrl+V. Devolver false faz o xterm não mandar
            // o ^V literal nem chamar preventDefault, então o colar nativo do
            // navegador acontece e o próprio xterm o recebe — o que funciona
            // também em http://IP, onde a Clipboard API nem existe.
            term.attachCustomKeyEventHandler(evento => {
                if (evento.type !== 'keydown' || !evento.ctrlKey || evento.altKey) return true;
                if (evento.key.toLowerCase() !== 'v') return true;
                if (evento.shiftKey) colarDaApi(term);
                return false;
            });

            term.onData(data => {
                if (t.encerrado) {
                    // Enter (ou qualquer tecla) reabre a sessão sob demanda.
                    t.encerrado = false;
                    conectar(t);
                    return;
                }
                if (t.ws && t.ws.readyState === WebSocket.OPEN) {
                    t.ws.send(JSON.stringify({ type: "input", data: data }));

                    // Gatilho 3: Enter no terminal pode ter mexido em arquivo;
                    // meio segundo depois, atualiza a árvore e as abas.
                    if (data.includes('\r')) {
                        setTimeout(() => {
                            mudarRaiz();
                            atualizarArquivosAbertos();
                        }, 500);
                    }
                }
            });

            conectar(t);
            return t;
        }

        // --- TECLAS EXTRAS E GESTOS DE TELEFONE ---
        // O teclado virtual não oferece as teclas que fazem um terminal ser
        // confortável. A faixa também serve ao editor para setas, tabulação e
        // símbolos frequentes, mas Ctrl é propositalmente um recurso do PTY.
        let ctrlMovel = false;

        function terminalEmFoco() {
            return terminalPor(focoTerminal) || terminaisVisiveis()[0] || null;
        }

        function mandarAoTerminal(texto) {
            const t = terminalEmFoco();
            if (!t) return;
            t.term.focus();
            if (t.encerrado) {
                t.encerrado = false;
                conectar(t);
                return;
            }
            if (t.ws && t.ws.readyState === WebSocket.OPEN) {
                t.ws.send(JSON.stringify({ type: 'input', data: texto }));
            }
        }

        function teclaNoEditor(tecla) {
            editor.focus();
            const comandos = {
                '↑': 'goLineUp', '↓': 'goLineDown', '←': 'goCharLeft', '→': 'goCharRight',
                'Pg↑': 'goPageUp', 'Pg↓': 'goPageDown', 'Home': 'goLineStart', 'End': 'goLineEnd'
            };
            if (comandos[tecla]) editor.execCommand(comandos[tecla]);
            else if (tecla === 'Tab') editor.replaceSelection('\t');
            else if (tecla !== 'Esc') editor.replaceSelection(tecla);
        }

        async function colarMovel() {
            try {
                const texto = await navigator.clipboard.readText();
                if (texto) mandarAoTerminal(texto);
            } catch (_) {
                // HTTP por IP não dá acesso ao clipboard em muitos navegadores.
                // O campo nativo ainda permite colar pelo menu do próprio celular.
                const texto = window.prompt('Cole o texto para enviar ao terminal:');
                if (texto) mandarAoTerminal(texto);
            }
        }

        function montarTeclasMoveis() {
            const barra = document.getElementById('mobile-keybar');
            const teclas = [
                ['Esc', '\x1b'], ['Ctrl', null], ['Tab', '\t'], ['↑', '\x1b[A'], ['↓', '\x1b[B'],
                ['←', '\x1b[D'], ['→', '\x1b[C'], ['Pg↑', '\x1b[5~'], ['Pg↓', '\x1b[6~'],
                ['Home', '\x1b[H'], ['End', '\x1b[F'], ['|', '|'], ['/', '/'], ['-', '-'], ['~', '~'],
                ['C', 'c'], ['D', 'd'], ['Z', 'z'], ['Colar', null]
            ];
            teclas.forEach(([rotulo, valor]) => {
                const b = document.createElement('button');
                b.textContent = rotulo;
                b.dataset.tecla = rotulo;
                b.addEventListener('click', () => {
                    if (rotulo === 'Ctrl') {
                        ctrlMovel = !ctrlMovel;
                        b.classList.toggle('modificador', ctrlMovel);
                        return;
                    }
                    if (rotulo === 'Colar') { colarMovel(); return; }
                    if (telaMovel === 'editor') {
                        teclaNoEditor(rotulo);
                        ctrlMovel = false;
                        document.querySelector('[data-tecla="Ctrl"]')?.classList.remove('modificador');
                        return;
                    }
                    let envio = valor;
                    if (ctrlMovel && valor && valor.length === 1) {
                        envio = String.fromCharCode(valor.toUpperCase().charCodeAt(0) & 31);
                    }
                    ctrlMovel = false;
                    document.querySelector('[data-tecla="Ctrl"]')?.classList.remove('modificador');
                    mandarAoTerminal(envio);
                });
                barra.appendChild(b);
            });
        }
        montarTeclasMoveis();

        function ajustarTecladoVirtual() {
            if (!estaNoMovel() || !window.visualViewport) return;
            const vv = window.visualViewport;
            const coberto = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            document.body.style.setProperty('--teclado-virtual', coberto + 'px');
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', ajustarTecladoVirtual);
            window.visualViewport.addEventListener('scroll', ajustarTecladoVirtual);
        }

        let gestoMovel = null;
        document.addEventListener('pointerdown', e => {
            if (!estaNoMovel() || e.pointerType !== 'touch') return;
            // A borda deixa o conteúdo receber normalmente toques e scrolls.
            if (e.clientX > 28 && e.clientX < window.innerWidth - 28) return;
            gestoMovel = { x: e.clientX, y: e.clientY, id: e.pointerId };
        }, { passive: true });
        document.addEventListener('pointerup', e => {
            if (!gestoMovel || gestoMovel.id !== e.pointerId) return;
            const dx = e.clientX - gestoMovel.x;
            const dy = e.clientY - gestoMovel.y;
            gestoMovel = null;
            if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const telas = ['files', 'terminal', 'editor'];
            const atual = telas.indexOf(telaMovel);
            const proxima = telas[atual + (dx < 0 ? 1 : -1)];
            if (proxima) trocarTelaMovel(proxima);
        }, { passive: true });
        document.addEventListener('pointercancel', () => { gestoMovel = null; }, { passive: true });

        // Os tamanhos entram antes de qualquer terminal existir: assim o
        // primeiro fit() já mede a caixa definitiva, sem precisar de correção.
        (function restaurarTamanhos() {
            const salvos = lerMemoria(CHAVES.tamanhos, null);
            if (!salvos) return;
            if (salvos.lateral) ajustarMedida('--larg-lateral', salvos.lateral);
            if (salvos.terminal) ajustarMedida('--alt-terminal', salvos.terminal);
        })();

        // Restaura os terminais da última visita, com a divisão de painéis que
        // estava na tela. Os formatos antigos (uma lista de abas, ou uma sessão
        // só) continuam sendo lidos: sem isso, quem atualiza o binário abandona
        // um shell que estava rodando.
        (function iniciarTerminais() {
            const salvos = lerMemoria(CHAVES.terminais, null);
