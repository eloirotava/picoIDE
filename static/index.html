<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pico IDE</title>
    
    <!-- Tudo em /vendor vem embutido no executável, não de CDN: a placa pode
         estar sem internet, e aí não haveria editor nem terminal. -->
    <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="/vendor/codemirror/theme/dracula.css">
    <script src="/vendor/codemirror/lib/codemirror.js"></script>
    <!-- O modo rust usa defineSimpleMode, que vem neste addon: sem ele o
         realce de .rs quebra silenciosamente. -->
    <script src="/vendor/codemirror/addon/mode/simple.js"></script>
    <script src="/vendor/codemirror/mode/javascript/javascript.js"></script>
    <script src="/vendor/codemirror/mode/rust/rust.js"></script>
    <!-- htmlmixed depende de xml + css + javascript -->
    <script src="/vendor/codemirror/mode/xml/xml.js"></script>
    <script src="/vendor/codemirror/mode/css/css.js"></script>
    <script src="/vendor/codemirror/mode/htmlmixed/htmlmixed.js"></script>
    <script src="/vendor/codemirror/mode/toml/toml.js"></script>

    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <script src="/vendor/xterm/lib/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; color: #ccc; font-family: sans-serif; display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 1fr 300px; height: 100vh; overflow: hidden; }
        #sidebar { grid-column: 1; grid-row: 1 / 3; background-color: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        #sidebar-header { padding: 10px; background-color: #333; display: flex; justify-content: space-between; align-items: center; }
        #root-path-input { background: #1e1e1e; color: #ccc; border: 1px solid #555; padding: 5px; width: 100%; border-radius: 3px; margin-right: 5px; outline: none; font-family: monospace;}
        #root-path-input:focus { border-color: #0e639c; }
        #sidebar-header button { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 0 5px; }
        #file-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .file-item { cursor: pointer; padding: 4px; border-radius: 3px; user-select: none; white-space: nowrap; }
        .file-item:hover { background-color: #37373d; }
        .is-dir { font-weight: bold; color: #d7ba7d; }
        .folder-children { border-left: 1px solid #444; margin-left: 10px; padding-left: 5px; }
        #sidebar.soltando { outline: 2px dashed #0e639c; outline-offset: -2px; }
        #status-upload:empty { display: none; }
        #status-upload { padding: 6px 10px; font-size: 12px; color: #d7ba7d; background: #2d2d30; }
        #editor-container { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; overflow: hidden; }
        #top-bar { background-color: #333; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; }
        #btn-baixar-atual { background: #3a3d41; color: #ccc; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; margin-right: 4px; }
        #btn-salvar { background: #0e639c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; transition: background 0.3s ease; }
        .CodeMirror { flex-grow: 1; height: 100%; font-size: 16px; }
        #terminal-container { grid-column: 2; grid-row: 2; background-color: #000; border-top: 1px solid #333; padding: 10px; overflow: hidden; box-sizing: border-box; }
        .terminal { height: 100%; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <input type="text" id="root-path-input" value="/" title="Digite a pasta e aperte Enter">
            <button onclick="document.getElementById('input-arquivos').click()" title="Enviar arquivos para esta pasta">📤</button>
            <button onclick="mudarRaiz()" title="Atualizar">🔄</button>
            <input type="file" id="input-arquivos" multiple hidden>
        </div>
        <div id="status-upload"></div>
        <div id="file-list">Carregando...</div>
    </div>

    <div id="editor-container">
        <div id="top-bar">
            <span id="current-file">Nenhum arquivo aberto</span>
            <span>
                <button id="btn-baixar-atual" onclick="baixarAtual()" title="Baixar o arquivo aberto">⬇ Baixar</button>
                <button id="btn-salvar" onclick="salvarArquivo()">Salvar (Ctrl+S)</button>
            </span>
        </div>
        <textarea id="editor"></textarea>
    </div>

    <div id="terminal-container"></div>

    <script>
        // --- MEMÓRIA DE SESSÃO (sobrevive ao F5) ---
        const CHAVES = {
            raiz: 'picoide.rootPath',
            pastas: 'picoide.openFolders',
            arquivo: 'picoide.currentFile',
            sessao: 'picoide.terminalSession'
        };

        function lerMemoria(chave, padrao) {
            try {
                const bruto = localStorage.getItem(chave);
                return bruto === null ? padrao : JSON.parse(bruto);
            } catch (e) {
                return padrao;
            }
        }

        function gravarMemoria(chave, valor) {
            try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) { /* modo privado */ }
        }

        // --- EDITOR E AUTOSAVE ---
        const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
            lineNumbers: true, theme: "dracula", mode: "javascript"
        });

        let arquivoAtual = "";
        let timeoutAutosave = null;
        let bloqueiaAutosaveInicial = true;
        // Binário aberto: dá para baixar, não dá para editar nem salvar.
        let binarioAberto = false;

        // Baixar só faz sentido com arquivo aberto; salvar, só se for texto.
        function atualizarBotoes() {
            const baixar = document.getElementById('btn-baixar-atual');
            const salvar = document.getElementById('btn-salvar');
            baixar.disabled = !arquivoAtual;
            baixar.style.opacity = arquivoAtual ? '1' : '0.4';
            salvar.disabled = binarioAberto;
            salvar.style.opacity = binarioAberto ? '0.4' : '1';
        }

        editor.on("change", () => {
            if (!arquivoAtual || bloqueiaAutosaveInicial || binarioAberto) return;
            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = "Modificado...";
            btnSalvar.style.background = "#c77200"; 
            
            clearTimeout(timeoutAutosave);
            timeoutAutosave = setTimeout(() => { salvarArquivo(true); }, 5000);
        });

        document.addEventListener("keydown", function(e) {
            if ((window.navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)  && e.keyCode == 83) {
                e.preventDefault(); 
                clearTimeout(timeoutAutosave);
                salvarArquivo(false);
            }
        }, false);

        // --- SISTEMA DE ARQUIVOS COM AUTO-UPDATE ---

        // Memória inteligente: guarda os caminhos das pastas que você abriu
        const pastasAbertas = new Set(lerMemoria(CHAVES.pastas, []));
        const inputRaiz = document.getElementById('root-path-input');

        // Restaura a pasta da última visita antes do primeiro carregamento
        inputRaiz.value = lerMemoria(CHAVES.raiz, '/') || '/';

        function salvarPastasAbertas() {
            gravarMemoria(CHAVES.pastas, Array.from(pastasAbertas));
        }

        function mudarRaiz() {
            const novoCaminho = inputRaiz.value;
            gravarMemoria(CHAVES.raiz, novoCaminho);
            carregarArquivos(novoCaminho, document.getElementById('file-list'));
        }

        inputRaiz.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') mudarRaiz();
        });

        async function carregarArquivos(caminho, elementoPai) {
            // Evita o texto "Carregando" na raiz para não piscar a tela no auto-update
            if (elementoPai.id === 'file-list' && elementoPai.innerHTML === '') {
                elementoPai.innerHTML = 'Carregando...';
            }
            
            const res = await fetch(`/api/files?path=${encodeURIComponent(caminho)}`);
            const files = await res.json();

            // Guarda os nomes da pasta aberta para o upload conseguir avisar
            // antes de sobrescrever algo.
            if (elementoPai.id === 'file-list') {
                nomesNaPasta.clear();
                files.forEach(f => { if (!f.is_dir) nomesNaPasta.add(f.name); });
            }

            // O que a árvore mostra é só nome e se é pasta, então isto resume
            // exatamente o que está na tela. Se não mudou, não repinta: trocar
            // o DOM à toa é o que faz a barra piscar a cada 10s, além de matar
            // a seleção de texto e a posição da rolagem.
            // O caminho entra na assinatura porque duas pastas diferentes podem
            // ter a mesma lista de nomes, e aí repintar é obrigatório.
            const assinatura = JSON.stringify([caminho, files.map(f => [f.name, f.is_dir])]);
            if (elementoPai.dataset.assinatura === assinatura) {
                // Nada novo aqui, mas uma subpasta aberta pode ter mudado.
                elementoPai
                    .querySelectorAll(':scope > .file-item > .folder-children')
                    .forEach(filho => {
                        if (filho.style.display !== 'none' && filho.dataset.caminho) {
                            carregarArquivos(filho.dataset.caminho, filho);
                        }
                    });
                return;
            }
            elementoPai.dataset.assinatura = assinatura;

            // Fragmento de documento permite montar a árvore na memória antes de jogar na tela (zero flicker)
            const fragment = document.createDocumentFragment();

            files.forEach(f => {
                const div = document.createElement('div');
                div.className = 'file-item ' + (f.is_dir ? 'is-dir' : '');
                const header = document.createElement('div');
                div.appendChild(header);

                if (f.is_dir) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'folder-children';
                    // Guardado no próprio nó para o refresh conseguir revisitar
                    // as subpastas abertas sem reconstruir a árvore.
                    childrenContainer.dataset.caminho = f.path;
                    
                    // Verifica se a pasta estava na memória de abertas
                    const isOpen = pastasAbertas.has(f.path);
                    header.textContent = (isOpen ? '📂 ' : '📁 ') + f.name;
                    childrenContainer.style.display = isOpen ? 'block' : 'none';
                    
                    div.appendChild(childrenContainer);

                    header.onclick = async (e) => {
                        e.stopPropagation();
                        if (childrenContainer.style.display === 'none') {
                            header.textContent = '📂 ' + f.name;
                            childrenContainer.style.display = 'block';
                            pastasAbertas.add(f.path);
                            salvarPastasAbertas();
                            await carregarArquivos(f.path, childrenContainer);
                        } else {
                            header.textContent = '📁 ' + f.name;
                            childrenContainer.style.display = 'none';
                            pastasAbertas.delete(f.path);
                            salvarPastasAbertas();
                            childrenContainer.innerHTML = '';
                            delete childrenContainer.dataset.assinatura;
                        }
                    };

                    // Se a pasta já estava aberta antes do refresh, busca os filhos dela silenciosamente
                    if (isOpen) {
                        carregarArquivos(f.path, childrenContainer);
                    }
                } else {
                    header.textContent = '📄 ' + f.name;
                    header.onclick = (e) => { e.stopPropagation(); abrirArquivo(f.path, f.name); };
                }
                fragment.appendChild(div);
            });

            elementoPai.innerHTML = '';
            elementoPai.appendChild(fragment);
        }

        // --- UPLOAD E DOWNLOAD ---

        // Um <a download> deixa o próprio navegador cuidar do salvamento, com
        // barra de progresso e sem passar o arquivo pela memória do JS.
        function baixarArquivo(caminho) {
            const a = document.createElement('a');
            a.href = `/api/download?path=${encodeURIComponent(caminho)}`;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function baixarAtual() {
            if (!arquivoAtual) return;
            baixarArquivo(arquivoAtual);
        }

        function avisar(texto) {
            document.getElementById('status-upload').textContent = texto;
        }

        // Nomes já presentes na pasta aberta, para avisar antes de sobrescrever.
        const nomesNaPasta = new Set();

        async function enviarArquivos(lista) {
            const arquivos = Array.from(lista);
            if (!arquivos.length) return;

            const pasta = inputRaiz.value || '/';
            const base = pasta.endsWith('/') ? pasta : pasta + '/';
            let enviados = 0;

            for (const arquivo of arquivos) {
                if (nomesNaPasta.has(arquivo.name) &&
                    !confirm(`Já existe "${arquivo.name}" nesta pasta. Substituir?`)) {
                    continue;
                }

                avisar(`Enviando ${arquivo.name}...`);
                try {
                    const res = await fetch(
                        `/api/upload?path=${encodeURIComponent(base + arquivo.name)}`,
                        { method: 'POST', body: arquivo });
                    if (!res.ok) {
                        avisar(`Falhou ${arquivo.name}: ${await res.text()}`);
                        return;
                    }
                    enviados++;
                } catch (e) {
                    avisar(`Falhou ${arquivo.name}: ${e}`);
                    return;
                }
            }

            avisar(enviados ? `${enviados} arquivo(s) enviado(s).` : '');
            mudarRaiz();
            setTimeout(() => avisar(''), 4000);
        }

        document.getElementById('input-arquivos').addEventListener('change', (e) => {
            enviarArquivos(e.target.files);
            e.target.value = '';  // permite reenviar o mesmo arquivo depois
        });

        // Arrastar da máquina para a barra lateral envia para a pasta aberta.
        const sidebar = document.getElementById('sidebar');
        ['dragenter', 'dragover'].forEach(ev => sidebar.addEventListener(ev, (e) => {
            e.preventDefault();
            sidebar.classList.add('soltando');
        }));
        ['dragleave', 'drop'].forEach(ev => sidebar.addEventListener(ev, (e) => {
            e.preventDefault();
            sidebar.classList.remove('soltando');
        }));
        sidebar.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files.length) {
                enviarArquivos(e.dataTransfer.files);
            }
        });

        async function abrirArquivo(caminho, nome) {
            bloqueiaAutosaveInicial = true;
            clearTimeout(timeoutAutosave);

            const res = await fetch(`/api/read?path=${encodeURIComponent(caminho)}`);
            if (res.status === 415) {
                // Binário: o editor não tem o que mostrar, mas o arquivo é
                // real e continua sendo o arquivo aberto — é assim que dá para
                // baixá-lo, que é o único jeito de tirar um build da placa.
                arquivoAtual = caminho;
                binarioAberto = true;
                gravarMemoria(CHAVES.arquivo, { path: caminho, name: nome });
                document.getElementById('current-file').textContent = `${nome} (binário)`;
                editor.setValue("Arquivo binário");
                // readOnly evita o pior caso: digitar por cima e o autosave
                // gravar este texto em cima do binário.
                editor.setOption("readOnly", true);
                atualizarBotoes();
                return;
            }
            if (!res.ok) {
                // Arquivo sumiu: não assume ele como atual, senão o autosave o recriaria.
                document.getElementById('current-file').textContent = `${nome} (não encontrado)`;
                arquivoAtual = "";
                binarioAberto = false;
                editor.setOption("readOnly", false);
                gravarMemoria(CHAVES.arquivo, null);
                atualizarBotoes();
                return;
            }
            const texto = await res.text();

            arquivoAtual = caminho;
            binarioAberto = false;
            editor.setOption("readOnly", false);
            gravarMemoria(CHAVES.arquivo, { path: caminho, name: nome });
            document.getElementById('current-file').textContent = nome;
            atualizarBotoes();

            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = "Salvar (Ctrl+S)";
            btnSalvar.style.background = "#0e639c";

            if(nome.endsWith('.rs')) editor.setOption("mode", "rust");
            else if(nome.endsWith('.html')) editor.setOption("mode", "htmlmixed");
            else if(nome.endsWith('.toml')) editor.setOption("mode", "toml");
            else editor.setOption("mode", "javascript");
            
            editor.setValue(texto);
            setTimeout(() => { bloqueiaAutosaveInicial = false; }, 100);
        }

        async function salvarArquivo(isAuto = false) {
            // Salvar um binário gravaria o texto do aviso por cima dele.
            if (!arquivoAtual || binarioAberto) return;

            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.textContent = isAuto ? "Autosalvando..." : "Salvando...";
            
            await fetch('/api/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: arquivoAtual, content: editor.getValue() })
            });

            btnSalvar.textContent = "Salvo!";
            btnSalvar.style.background = "#2a7522"; 
            
            // Dispara um refresh silencioso da árvore ao salvar
            mudarRaiz();
            
            setTimeout(() => {
                if (btnSalvar.textContent === "Salvo!") {
                    btnSalvar.textContent = "Salvar (Ctrl+S)";
                    btnSalvar.style.background = "#0e639c"; 
                }
            }, 2000);
        }

        // --- GATILHOS DE AUTO-UPDATE ---
        
        atualizarBotoes();

        // Gatilho 1: Início — já na pasta que estava aberta antes do F5
        mudarRaiz();

        // Reabre o arquivo em que você estava trabalhando
        const ultimoArquivo = lerMemoria(CHAVES.arquivo, null);
        if (ultimoArquivo && ultimoArquivo.path) {
            abrirArquivo(ultimoArquivo.path, ultimoArquivo.name);
        }

        // Gatilho 2: Atualização silenciosa a cada 10 segundos, mas apenas se você estiver com a tela ativa
        setInterval(() => {
            if (document.visibilityState === 'visible') {
                mudarRaiz();
            }
        }, 10000);

        // --- TERMINAL ---
        const term = new Terminal({ 
            theme: { background: '#000' }, fontFamily: 'monospace', fontSize: 14, cursorBlink: true 
        });
        
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        let ws = null;
        let tentativasReconexao = 0;
        let shellEncerrado = false;
        // O id da sessão de terminal mora aqui: é ele que faz o shell (e a
        // compilação rodando nele) sobreviver a fechar a aba.
        let sessaoTerminal = lerMemoria(CHAVES.sessao, null);

        function sincronizarTamanhoTerminal() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
            }
        }

        function conectarTerminal() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Manda a pasta atual para o shell nascer nela, e não na raiz.
            const cwd = encodeURIComponent(inputRaiz.value || '/');
            // O cwd só vale para shell novo; reatando, o servidor ignora e o
            // shell continua na pasta onde ele já estava.
            let url = `${protocol}//${window.location.host}/api/ws?cwd=${cwd}`;
            if (sessaoTerminal) {
                url += `&sessao=${encodeURIComponent(sessaoTerminal)}`;
            }
            ws = new WebSocket(url);

            ws.onopen = () => {
                shellEncerrado = false;
                fitAddon.fit();
                sincronizarTamanhoTerminal();
            };

            // O servidor abre a conversa dizendo qual sessão nos coube, e só
            // depois manda o histórico e a saída ao vivo.
            function tratarAnuncio(texto) {
                let msg;
                try { msg = JSON.parse(texto); } catch (e) { return false; }
                if (!msg || msg.type !== 'sessao') return false;

                sessaoTerminal = msg.id;
                gravarMemoria(CHAVES.sessao, sessaoTerminal);

                if (msg.reatou) {
                    // Limpa antes de repintar: o histórico que vem a seguir é
                    // a tela inteira da sessão, e sem isso ela sairia duplicada
                    // por cima do que já estava aqui.
                    term.reset();
                    term.write(tentativasReconexao > 0
                        ? '\x1b[32m[Pico IDE] Reconectado.\x1b[0m\r\n'
                        : '\x1b[32m[Pico IDE] Sessão retomada.\x1b[0m\r\n');
                } else {
                    term.write(tentativasReconexao > 0
                        ? '\r\n\x1b[32m[Pico IDE] Reconectado (shell novo).\x1b[0m\r\n'
                        : '\x1b[32m[Pico IDE] Conectado como root no Banana Pi M1!\x1b[0m\r\n');
                }
                tentativasReconexao = 0;
                return true;
            }

            ws.onmessage = (evt) => {
                if (evt.data instanceof Blob) {
                    evt.data.arrayBuffer().then(buf => term.write(new Uint8Array(buf)));
                } else if (evt.data instanceof ArrayBuffer) {
                    term.write(new Uint8Array(evt.data));
                } else if (!tratarAnuncio(evt.data)) {
                    term.write(evt.data);
                }
            };

            ws.onclose = (evt) => {
                // Fechamento limpo = o shell terminou (exit / Ctrl+D). Nesse caso
                // reconectar sozinho só abriria um shell novo sem você pedir.
                if (evt.wasClean) {
                    shellEncerrado = true;
                    // A sessão morreu de verdade: esquecer o id, senão a
                    // próxima visita tentaria reatar num shell que não existe.
                    sessaoTerminal = null;
                    gravarMemoria(CHAVES.sessao, null);
                    term.write('\r\n\x1b[33m[Pico IDE] Sessão encerrada. Aperte Enter para abrir um shell novo.\x1b[0m\r\n');
                    return;
                }
                // Queda de rede: volta sozinho, com espera crescente até 10s.
                const espera = Math.min(1000 * Math.pow(2, tentativasReconexao), 10000);
                tentativasReconexao++;
                term.write(`\r\n\x1b[31m[Pico IDE] Conexão perdida. Reconectando em ${espera / 1000}s...\x1b[0m\r\n`);
                setTimeout(conectarTerminal, espera);
            };
        }

        conectarTerminal();

        term.onData(data => {
            if (shellEncerrado) {
                // Enter (ou qualquer tecla) reabre a sessão sob demanda.
                shellEncerrado = false;
                conectarTerminal();
                return;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "input", data: data }));

                // Gatilho 3: Se o usuário apertar Enter (\r) no terminal, aguarda meio segundo para
                // dar tempo do comando do Linux terminar, e atualiza a árvore de arquivos.
                if (data.includes('\r')) {
                    setTimeout(mudarRaiz, 500);
                }
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            sincronizarTamanhoTerminal();
        });

        // Tráfego do lado do navegador; o servidor manda os Pings do lado dele.
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "ping" }));
            }
        }, 30000);
    </script>
</body>
</html>
