            if (salvos && salvos.layout) layout = restaurar(salvos.layout);

            if (!layout) {
                let lista = salvos && salvos.lista ? salvos.lista : [];
                if (!lista.length) {
                    const legado = lerMemoria(CHAVES.sessao, null);
                    if (legado) lista = [legado];
                }
                if (!lista.length) lista = [null];   // primeira visita: um terminal novo
                const ids = lista.map(sessao => criarTerminal(sessao).id);
                const i = salvos && salvos.ativa >= 0 && salvos.ativa < ids.length
                    ? salvos.ativa : 0;
                layout = { tipo: 'grupo', abas: ids, ativa: ids[i] };
            }

            const foco = salvos && salvos.foco
                ? terminais.find(t => t.sessao === salvos.foco) : null;
            const primeiro = gruposDoLayout()[0];
            focoTerminal = foco ? foco.id : (primeiro ? primeiro.ativa : null);
            aplicarLayout();
        })();

        window.addEventListener('resize', () => ajustarVisiveis({ avisarShell: true }));

        // --- DIVISÓRIAS ARRASTÁVEIS ---
        function medida(variavel) {
            return parseInt(getComputedStyle(document.body)
                .getPropertyValue(variavel), 10);
        }

        function ajustarMedida(variavel, valor) {
            // Os limites são calculados aqui dentro, e não num const lá em
            // cima: a restauração dos tamanhos roda antes desta seção, e uma
            // referência a const ainda não inicializada estouraria.
            const limites = {
                '--larg-lateral': { min: 150, max: window.innerWidth - 300 },
                '--alt-terminal': { min: 80,  max: window.innerHeight - 150 }
            };
            const lim = limites[variavel];
            const preso = Math.max(lim.min, Math.min(valor, lim.max));
            document.body.style.setProperty(variavel, preso + 'px');
            return preso;
        }

        function salvarTamanhos() {
            gravarMemoria(CHAVES.tamanhos, {
                lateral: medida('--larg-lateral'),
                terminal: medida('--alt-terminal')
            });
        }

        // O xterm não se reajusta sozinho: além do fit() visual, o shell
        // precisa saber as novas dimensões, senão continua quebrando linha
        // pela geometria antiga. Vale para todos os painéis à vista.
        function reajustarPaineis({ avisarShell }) {
            ajustarVisiveis({ avisarShell });
            if (editor) editor.refresh();
        }

        function arrastar(divisoria, variavel, eixo) {
            document.getElementById(divisoria).addEventListener('mousedown', (e) => {
                e.preventDefault();
                document.body.classList.add('arrastando');

                const mover = (ev) => {
                    // A lateral cresce com o ponteiro; o terminal, ao contrário,
                    // porque ele é medido a partir da base da janela.
                    ajustarMedida(variavel, eixo === 'x'
                        ? ev.clientX
                        : window.innerHeight - ev.clientY);
                    // Só o ajuste visual durante o arrasto: mandar um resize ao
                    // shell a cada pixel entupiria o PTY à toa.
                    reajustarPaineis({ avisarShell: false });
                };

                const soltar = () => {
                    document.removeEventListener('mousemove', mover);
                    document.removeEventListener('mouseup', soltar);
                    document.body.classList.remove('arrastando');
                    // Agora sim o shell é avisado, uma vez só.
                    reajustarPaineis({ avisarShell: true });
                    salvarTamanhos();
                };

                document.addEventListener('mousemove', mover);
                document.addEventListener('mouseup', soltar);
            });
        }

        arrastar('divisoria-lateral', '--larg-lateral', 'x');
        arrastar('divisoria-terminal', '--alt-terminal', 'y');

        // Tráfego do lado do navegador; o servidor manda os Pings do lado dele.
        setInterval(() => {
            terminais.forEach(t => {
                if (t.ws && t.ws.readyState === WebSocket.OPEN) {
                    t.ws.send(JSON.stringify({ type: "ping" }));
                }
            });
        }, 30000);
    </script>
</body>
</html>
