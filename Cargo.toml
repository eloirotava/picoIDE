[package]
name = "meu-mini-ide"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web e Async
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
# ReaderStream: deixa o download sair em pedaços, para baixar um binário
# grande não significar carregá-lo inteiro na RAM do servidor.
tokio-util = { version = "0.7", features = ["io"] }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal Real
portable-pty = "0.8"
futures-util = "0.3"

# O binário deve continuar leve em qualquer host, então tamanho vale mais que
# microdesempenho: o trabalho aqui é I/O (PTY, rede, disco), não CPU. Em armhf:
# 2,81 MB só com strip de símbolos -> 2,11 MB com tudo isto ligado.
#
# `panic = "abort"` encolheria mais, mas fica de fora de propósito: com ele um
# panic em qualquer requisição derruba o processo inteiro, e junto vão todas as
# sessões de terminal persistentes — inclusive builds em andamento.
[profile.release]
strip = true          # símbolos e debuginfo, sem depender de RUSTFLAGS
lto = true
codegen-units = 1
opt-level = "z"       # troque por "s" se algum dia o tamanho importar menos
