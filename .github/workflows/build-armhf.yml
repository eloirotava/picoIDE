name: Build armhf estático

on:
  push:
    branches: [main]
  # Roda também nos PRs, para o build já vir verificado antes do merge.
  pull_request:
  workflow_dispatch:

concurrency:
  group: armhf-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: armv7-unknown-linux-musleabihf
  # musl já linka estático por padrão. rust-lld dispensa instalar um
  # toolchain de cross-compilação C, porque o projeto é Rust puro.
  RUSTFLAGS: -C linker=rust-lld -C strip=symbols

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Rust com o alvo armhf
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Compila
        run: cargo build --release --target "$TARGET"

      - name: Confere que saiu estático e ARMv7 hard-float
        run: |
          BIN="target/$TARGET/release/meu-mini-ide"
          file "$BIN"
          readelf -A "$BIN" | grep -E 'Tag_CPU_arch:|Tag_ABI_VFP_args:'

          # Um binário dinâmico rodaria na máquina de quem tem as libs certas
          # e falharia no Banana Pi, então isso precisa ser um erro duro.
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "::error::O binário ficou dinâmico (tem dependências NEEDED)."
            exit 1
          fi
          if ! file "$BIN" | grep -q "ARM"; then
            echo "::error::O binário não é ARM."
            exit 1
          fi
          if ! readelf -A "$BIN" | grep -q "Tag_ABI_VFP_args: VFP registers"; then
            echo "::error::O binário não é hard-float (armhf)."
            exit 1
          fi

          cp "$BIN" picoide-armhf

      - name: Sobe o binário sob emulação ARM e testa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

          qemu-arm-static ./picoide-armhf &
          SERVIDOR=$!

          subiu=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then subiu=1; break; fi
            sleep 1
          done

          if [ "$subiu" != "1" ]; then
            echo "::error::O binário armhf não respondeu na porta 8080."
            kill $SERVIDOR 2>/dev/null || true
            exit 1
          fi
          echo "A página abriu."

          if ! curl -sf "http://127.0.0.1:8080/api/files?path=/" | grep -q '"is_dir"'; then
            echo "::error::/api/files não devolveu a listagem esperada."
            kill $SERVIDOR 2>/dev/null || true
            exit 1
          fi
          echo "A API de arquivos respondeu."

          kill $SERVIDOR 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: picoide-armhf
          path: picoide-armhf
          if-no-files-found: error
