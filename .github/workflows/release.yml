# O único workflow do projeto, e ele só roda quando alguém aperta o botão:
# Actions -> Release -> Run workflow, informando a versão (ex.: v0.0.1).
#
# A tag é criada pela própria release, então não é preciso taguear à mão antes.
# Os testes de ponta a ponta ficaram fora daqui de propósito: rode-os na sua
# máquina com ./tests/e2e/run.sh antes de publicar.
name: Release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão da release (com o v na frente, ex.: v0.0.3)'
        required: true
        default: v0.0.3

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Executável ${{ matrix.nome }} estático
    runs-on: ubuntu-latest
    # musl já linka estático por padrão, e rust-lld dispensa instalar um
    # toolchain de cross-compilação C, porque o projeto é Rust puro.
    env:
      # O strip vem do [profile.release] do Cargo.toml.
      ALVO: ${{ matrix.alvo }}
      SAIDA: picoide-${{ matrix.nome }}${{ matrix.sufixo }}
    strategy:
      # Um alvo quebrado não impede de ver se os outros dois estão de pé.
      fail-fast: false
      matrix:
        include:
          - nome: amd64
            alvo: x86_64-unknown-linux-musl
            padrao_file: x86-64
            qemu: ''
            sufixo: ''
          - nome: armhf
            alvo: armv7-unknown-linux-musleabihf
            padrao_file: 'ELF 32-bit.*ARM,'
            qemu: qemu-arm-static
            sufixo: ''
          - nome: arm64
            alvo: aarch64-unknown-linux-musl
            padrao_file: ARM aarch64
            qemu: qemu-aarch64-static
            sufixo: ''
          - nome: win64
            alvo: x86_64-pc-windows-gnu
            padrao_file: 'PE32\+ executable.*x86-64'
            qemu: skip
            sufixo: .exe
          - nome: win32
            alvo: i686-pc-windows-gnu
            padrao_file: 'PE32 executable.*Intel 80386'
            qemu: skip
            sufixo: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Rust com o alvo ${{ matrix.nome }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.alvo }}

      - name: Instala dependências (Linux e Windows)
        run: |
          if [[ "$ALVO" == *"windows"* ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mingw-w64
            echo "RUSTFLAGS=" >> $GITHUB_ENV
          else
            echo "RUSTFLAGS=-C linker=rust-lld" >> $GITHUB_ENV
          fi

      - name: Compila
        run: cargo build --release --target "$ALVO"

      - name: Confere que saiu estático e na arquitetura certa
        run: |
          BIN="target/$ALVO/release/meu-mini-ide${{ matrix.sufixo }}"
          file "$BIN"

          # Um binário dinâmico rodaria em quem tem as libs certas e falharia
          # em quem não tem, então isso é erro duro e não aviso. (Só válido para Linux)
          if [ "${{ matrix.sufixo }}" = "" ]; then
            if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
              echo "::error::O binário ficou dinâmico (tem dependências NEEDED)."
              exit 1
            fi
          fi

          # Entregar o binário de uma arquitetura com o nome de outra rende um
          # "syntax error" incompreensível na máquina de quem baixou.
          if ! file "$BIN" | grep -qE '${{ matrix.padrao_file }}'; then
            echo "::error::O binário não casa com a arquitetura ${{ matrix.nome }}."
            exit 1
          fi

          if [ "${{ matrix.nome }}" = "armhf" ]; then
            readelf -A "$BIN" | grep -E 'Tag_CPU_arch:|Tag_ABI_VFP_args:'
            if ! readelf -A "$BIN" | grep -q "Tag_ABI_VFP_args: VFP registers"; then
              echo "::error::O binário não é hard-float (armhf)."
              exit 1
            fi
          fi

          cp "$BIN" "$SAIDA"

      - name: Sobe o binário e testa
        run: |
          if [ "${{ matrix.qemu }}" = "skip" ]; then
            echo "Pulando teste para ${{ matrix.nome }} (Windows)"
            exit 0
          fi

          if [ -n "${{ matrix.qemu }}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static
          fi

          # Emulação só onde a arquitetura não é a do runner; o amd64 roda nativo.
          ${{ matrix.qemu }} ./"$SAIDA" &
          SERVIDOR=$!

          morre() {
            echo "::error::$1"
            kill $SERVIDOR 2>/dev/null || true
            exit 1
          }

          subiu=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then subiu=1; break; fi
            sleep 1
          done
          [ "$subiu" = "1" ] || morre "O binário ${{ matrix.nome }} não respondeu na porta 8080."
          echo "A página abriu."

          curl -sf "http://127.0.0.1:8080/api/files?path=/" | grep -q '"is_dir"' \
            || morre "/api/files não devolveu a listagem esperada."
          echo "A API de arquivos respondeu."

          # A interface só abre sem internet se as libs saírem do próprio
          # binário, então conferimos no executável que vai ser publicado.
          for asset in $(grep -oE '/vendor/[A-Za-z0-9./_-]+' static/index.html | sort -u); do
            curl -sf -o /dev/null "http://127.0.0.1:8080$asset" \
              || morre "O binário não serviu $asset."
          done
          curl -sf -o /dev/null "http://127.0.0.1:8080/icone.svg" \
            || morre "O binário não serviu /icone.svg."
          echo "As libs embutidas responderam."

          kill $SERVIDOR 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: picoide-${{ matrix.nome }}
          path: ${{ env.SAIDA }}
          if-no-files-found: error

  release:
    name: Publica a release
    # Só publica quando os cinco builds terminaram e os três Linux subiram.
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSAO: ${{ inputs.versao }}
    steps:
      - name: Confere o formato da versão
        run: |
          # Versão fora do padrão vira tag torta e quebra o link da
          # "última release" que o README manda o usuário seguir.
          echo "$VERSAO" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Versão inválida: $VERSAO (esperado vX.Y.Z)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: picoide-*
          merge-multiple: true

      - name: Gera os checksums
        run: |
          chmod +x picoide-* || true
          sha256sum picoide-amd64 picoide-armhf picoide-arm64 picoide-win64.exe picoide-win32.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Cria a release com os binários anexados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<NOTAS
          Binários estáticos (musl). Não precisa instalar nada, nem a máquina
          precisa de internet: o HTML da interface e as libs de frontend vão
          embutidos no executável.

          | Arquivo | Para |
          | --- | --- |
          | \`picoide-amd64\` | PC/servidor Linux x86-64 |
          | \`picoide-arm64\` | Linux ARM 64-bit (Raspberry Pi 3/4/5 em SO 64-bit, Orange Pi, etc) |
          | \`picoide-armhf\` | Linux ARM 32-bit hard-float |
          | \`picoide-win64.exe\` | Windows 64-bit |
          | \`picoide-win32.exe\` | Windows 32-bit |

          Na dúvida sobre qual baixar, rode \`uname -m\`: \`x86_64\` → amd64,
          \`aarch64\` → arm64, \`armv7l\` → armhf. No Windows, \`win64\` é a opção mais comum.

          ## Instalando

          \`\`\`sh
          chmod +x picoide-amd64
          ./picoide-amd64
          \`\`\`

          Depois abra \`http://IP-DA-MAQUINA:8080\`.

          ## Conferindo o download

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          ## Mudanças

          https://github.com/$GITHUB_REPOSITORY/commits/$VERSAO
          NOTAS

          # O --target cria a tag apontando para o commit deste run.
          gh release create "$VERSAO" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "picoIDE $VERSAO" \
            --notes-file notas.md \
            picoide-amd64 picoide-arm64 picoide-armhf picoide-win64.exe picoide-win32.exe SHA256SUMS
